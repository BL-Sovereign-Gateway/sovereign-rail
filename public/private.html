<script>
    // Utility to convert attached files to Base64 Data URLs safely
    function readFileAsDataURL(file) {
        return new Promise((resolve, reject) => {
            if (!file) return resolve(null);
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
            reader.readAsDataURL(file);
        });
    }

    // Helper to safely fetch input element values without crashing
    function getInputValue(id) {
        const el = document.getElementById(id);
        return el ? el.value.trim() : '';
    }

    function getSelectedFile(id) {
        const el = document.getElementById(id);
        return (el && el.files && el.files[0]) ? el.files[0] : null;
    }

    // Master Dispatch Function — Handles Web Feed, Mass Email, and SMS
    async function handleBroadcastDispatch(mode) {
        const headline = getInputValue('broadcastHeadline');
        const smsContent = getInputValue('smsContent');
        const emailContent = getInputValue('emailContent');
        
        const imageFile = getSelectedFile('imageInput');
        const videoFile = getSelectedFile('videoInput');

        // 1. Validation according to mode
        if (mode === 'sms' && !smsContent) {
            alert('⚠️ Please enter message content in the SMS textarea.');
            return;
        }

        if ((mode === 'web' || mode === 'email') && (!headline || !(emailContent || smsContent))) {
            alert('⚠️ Please provide both a Headline/Subject and Message Content.');
            return;
        }

        // Warning for large file attachments
        if (videoFile && videoFile.size > 10 * 1024 * 1024) {
            alert('⚠️ Video file is too large (over 10MB). Base64 upload may fail on the server.');
            return;
        }

        // 2. Prepare Payload
        try {
            const imageUrl = await readFileAsDataURL(imageFile);
            const videoUrl = await readFileAsDataURL(videoFile);
            const bodyContent = emailContent || smsContent;

            let endpoint = '';
            let payload = {};

            if (mode === 'web') {
                endpoint = '/api/v1/newsletter/publish';
                payload = {
                    headline: headline,
                    content: bodyContent,
                    imageUrl: imageUrl,
                    videoUrl: videoUrl,
                    notifySubscribers: false
                };
            } else if (mode === 'email') {
                endpoint = '/api/v1/newsletter/publish';
                payload = {
                    headline: headline,
                    content: bodyContent,
                    imageUrl: imageUrl,
                    videoUrl: videoUrl,
                    notifySubscribers: true
                };
            } else if (mode === 'sms') {
                endpoint = '/api/v1/admin/broadcast-sms';
                payload = {
                    message: smsContent
                };
            }

            // 3. Execute Request
            const response = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const result = await response.json();

            if (response.ok && (result.status === 'success' || result.success)) {
                const actionNames = {
                    web: 'published to Website Feed',
                    email: 'dispatched as Mass Email Newsletter',
                    sms: 'dispatched via SMS'
                };
                alert(`✅ Success! Broadcast successfully ${actionNames[mode]}.`);
                
                // Clear inputs on success safely
                ['broadcastHeadline', 'smsContent', 'emailContent', 'imageInput', 'videoInput'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.value = '';
                });
            } else {
                alert('❌ Dispatch Failed: ' + (result.message || 'Server error encountered.'));
            }

        } catch (err) {
            console.error('Broadcast Error:', err);
            alert('❌ Network/Processing error: ' + err.message);
        }
    }

    // Individual trigger bindings matching your button onclick attributes
    function publishToWebsite() {
        handleBroadcastDispatch('web');
    }

    function dispatchMassEmail() {
        handleBroadcastDispatch('email');
    }

    function dispatchMassSMS() {
        if (confirm('Are you sure you want to dispatch mass SMS at ₦6.00/SMS?')) {
            handleBroadcastDispatch('sms');
        }
    }
</script>
