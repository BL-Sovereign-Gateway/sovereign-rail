<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Betting Wallet Top-Up | @BL SOVEREIGN GATEWAY</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { background: #1e293b; border: 1px solid #38bdf8; border-radius: 16px; padding: 30px; width: 100%; max-width: 480px; box-shadow: 0 20px 25px rgba(0,0,0,0.5); }
        .brand-header { text-align: center; margin-bottom: 20px; }
        .brand-header h2 { font-size: 1.3rem; font-weight: 800; color: #38bdf8; margin: 0; }
        .brand-header p { font-size: 0.75rem; color: #94a3b8; letter-spacing: 1px; margin-top: 2px; text-transform: uppercase; }
        .form-group { margin-bottom: 14px; }
        label { display: block; font-size: 0.85rem; color: #cbd5e1; margin-bottom: 6px; }
        input, select { width: 100%; padding: 12px; border-radius: 8px; background: #0f172a; border: 1px solid #334155; color: #fff; font-size: 0.9rem; outline: none; }
        input:focus, select:focus { border-color: #38bdf8; }
        
        .payment-options { display: flex; gap: 10px; margin: 15px 0; }
        .pay-option { flex: 1; padding: 10px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; text-align: center; cursor: pointer; font-size: 0.8rem; font-weight: 600; color: #cbd5e1; }
        .pay-option.active { border-color: #38bdf8; color: #38bdf8; background: rgba(56, 189, 248, 0.1); }
        
        .btn-submit { width: 100%; padding: 14px; background: #10b981; color: #fff; border: none; border-radius: 8px; font-weight: 800; cursor: pointer; font-size: 1rem; margin-top: 10px; }
        .btn-submit:hover { background: #059669; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; z-index: 1000; }
        .modal-box { background: #1e293b; border: 1px solid #38bdf8; border-radius: 16px; padding: 24px; width: 90%; max-width: 420px; text-align: center; }
        .modal-btn { background: #0ea5e9; color: #fff; border: none; padding: 10px 24px; border-radius: 8px; font-weight: 700; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

<div class="card">
    <div class="brand-header">
        <h2>🎰 INSTANT BETTING TOP-UP</h2>
        <p>ALL TIME BUSINESS LTD | @BL SOVEREIGN GATEWAY</p>
    </div>

    <form id="bettingForm">
        <div class="form-group">
            <label>Select Bookmaker / Platform *</label>
            <select id="bookmakerSelect" required>
                <option value="" disabled selected>Loading Bookmakers...</option>
            </select>
        </div>

        <div class="form-group">
            <label>Betting User ID / Account ID *</label>
            <input type="text" id="userId" placeholder="e.g. 08012345678 or 123456" required>
        </div>

        <div class="form-group">
            <label>Funding Amount (₦) *</label>
            <input type="number" id="amount" placeholder="1000" min="100" required>
        </div>

        <label>Payment Method</label>
        <div class="payment-options">
            <div class="pay-option active" onclick="setPayMethod('WALLET', this)">💼 Gateway Wallet</div>
            <div class="pay-option" onclick="setPayMethod('TRANSFER', this)">🏦 Bank Transfer</div>
            <div class="pay-option" onclick="setPayMethod('CARD', this)">💳 Card / USSD</div>
        </div>

        <!-- COMPLETE NIGERIAN BANKS DROPDOWN -->
        <div class="form-group" id="bankSelectorGroup" style="display:none; margin-top:12px;">
            <label>Select Source / Transfer Bank (All Nigerian Banks) *</label>
            <select id="sourceBankSelect">
                <optgroup label="Commercial Banks">
                    <option value="ACCESS">Access Bank</option>
                    <option value="FBN">First Bank of Nigeria</option>
                    <option value="GTB">Guaranty Trust Bank (GTBank)</option>
                    <option value="ZENITH">Zenith Bank Plc</option>
                    <option value="UBA">United Bank for Africa (UBA)</option>
                    <option value="FCMB">First City Monument Bank (FCMB)</option>
                    <option value="FIDELITY">Fidelity Bank</option>
                    <option value="STANBIC">Stanbic IBTC Bank</option>
                    <option value="STERLING">Sterling Bank</option>
                    <option value="UNION">Union Bank of Nigeria</option>
                    <option value="WEMA">Wema Bank</option>
                    <option value="POLARIS">Polaris Bank</option>
                    <option value="KEYSTONE">Keystone Bank</option>
                    <option value="UNITY">Unity Bank</option>
                    <option value="JAIZ">Jaiz Bank</option>
                    <option value="TAJ">TAJ Bank</option>
                    <option value="GLOBUS">Globus Bank</option>
                    <option value="PARALLEX">Parallex Bank</option>
                    <option value="SUNTRUST">SunTrust Bank</option>
                    <option value="PROVIDUS">Providus Bank</option>
                    <option value="CITIBANK">Citibank Nigeria</option>
                    <option value="SCBN">Standard Chartered Bank</option>
                </optgroup>
                <optgroup label="Microfinance Banks & Digital Fintechs">
                    <option value="OPAY">OPay Digital Services (Paycom)</option>
                    <option value="PALMPAY">PalmPay</option>
                    <option value="MONIEPOINT">Moniepoint MFB</option>
                    <option value="KUDA">Kuda MFB</option>
                    <option value="POCKET">PiggyTech (Pocket App)</option>
                    <option value="VFD">VFD Microfinance Bank</option>
                    <option value="SAFEHAVEN">Safe Haven MFB</option>
                    <option value="HASAL">Hasal MFB</option>
                    <option value="INFINITY">Infinity MFB</option>
                    <option value="LIVINGTRUST">LivingTrust MFB</option>
                    <option value="MINT">Mint MFB</option>
                </optgroup>
            </select>
        </div>

        <button type="submit" class="btn-submit" id="btnSubmit">Proceed to Fund Wallet</button>
    </form>
</div>

<!-- Modal Popup -->
<div class="modal-overlay" id="customModal">
    <div class="modal-box">
        <h3 style="color:#38bdf8; margin-bottom:12px;">@BL SOVEREIGN GATEWAY</h3>
        <div id="modalBody" style="font-size:0.9rem; color:#cbd5e1; line-height:1.5; margin-bottom:15px; text-align:left;"></div>
        <button class="modal-btn" onclick="closeModal()">Close</button>
    </div>
</div>

<script>
let selectedPayMethod = 'WALLET';

const FALLBACK_BOOKMAKERS = [
    { id: 'SportyBet', name: 'SportyBet' },
    { id: 'Bet9ja', name: 'Bet9ja' },
    { id: '1xBet', name: '1xBet' },
    { id: 'BetKing', name: 'BetKing' },
    { id: 'MSport', name: 'MSport' },
    { id: 'Betway', name: 'Betway' },
    { id: 'Betano', name: 'Betano' },
    { id: '1Win', name: '1Win' },
    { id: '22Bet', name: '22Bet' },
    { id: 'Melbet', name: 'Melbet' },
    { id: 'BetWinner', name: 'BetWinner' },
    { id: 'MozzartBet', name: 'MozzartBet' },
    { id: 'BetPawa', name: 'BetPawa' },
    { id: 'BangBet', name: 'BangBet' },
    { id: 'Merrybet', name: 'Merrybet' },
    { id: 'NairaBet', name: 'NairaBet' },
    { id: 'AccessBet', name: 'AccessBet' },
    { id: 'LiveScoreBet', name: 'LiveScoreBet' },
    { id: 'iLotBet', name: 'iLotBet' },
    { id: 'PariPesa', name: 'PariPesa' },
    { id: 'ZEbet', name: 'ZEbet' },
    { id: 'SureBet247', name: 'SureBet247' },
    { id: 'Green Lotto', name: 'Green Lotto' },
    { id: 'Winners Golden Bet', name: 'Winners Golden Bet' }
];

function setPayMethod(method, el) {
    selectedPayMethod = method;
    document.querySelectorAll('.pay-option').forEach(opt => opt.classList.remove('active'));
    el.classList.add('active');

    const bankGroup = document.getElementById('bankSelectorGroup');
    if (method === 'TRANSFER') {
        bankGroup.style.display = 'block';
    } else {
        bankGroup.style.display = 'none';
    }
}

function closeModal() {
    document.getElementById('customModal').style.display = 'none';
}

function renderReceipt(data) {
    const modalBody = document.getElementById('modalBody');
    const isSuccess = data.status === 'success';
    modalBody.innerHTML = `
        <div style="background:#0f172a; padding:16px; border-radius:10px; border:1px solid ${isSuccess ? '#10b981' : '#ef4444'};">
            <p style="color:${isSuccess ? '#10b981' : '#ef4444'}; font-weight:800; font-size:1rem; margin-bottom:8px;">${isSuccess ? '✅ BETTING WALLET FUNDED' : '❌ TRANSACTION DECLINED'}</p>
            <p style="font-size:0.85rem; color:#cbd5e1; margin-bottom:4px;"><strong>Transaction Ref:</strong> <span style="color:#38bdf8;">${data.orderRef}</span></p>
            <p style="font-size:0.85rem; color:#cbd5e1; margin-bottom:4px;"><strong>Platform:</strong> ${data.serviceTitle}</p>
            <p style="font-size:0.85rem; color:#cbd5e1; margin-bottom:4px;"><strong>Account ID:</strong> ${data.recipient}</p>
            <p style="font-size:0.85rem; color:#cbd5e1; margin-bottom:4px;"><strong>Amount Debited:</strong> ₦${parseFloat(data.amount).toLocaleString('en-NG', {minimumFractionDigits:2})}</p>
            <p style="font-size:0.85rem; color:#cbd5e1; margin-bottom:4px;"><strong>Payment Method:</strong> ${data.paymentMethod}</p>
            <p style="font-size:0.7rem; color:#94a3b8; margin-top:10px; border-top:1px dashed #334155; pt:4px;">Squad Gateway Verified & Auto-Released</p>
        </div>
    `;
    document.getElementById('customModal').style.display = 'flex';
}

async function loadBookmakers() {
    try {
        const res = await fetch('/api/v1/betting/providers');
        if (res.ok) {
            const data = await res.json();
            if (data.status === 'success' && data.data && data.data.length > 0) {
                populateSelect(data.data);
                return;
            }
        }
    } catch (err) {
        console.warn('API fetch warning, loading default bookmakers list...');
    }
    populateSelect(FALLBACK_BOOKMAKERS);
}

function populateSelect(list) {
    const select = document.getElementById('bookmakerSelect');
    select.innerHTML = '<option value="" disabled selected>Select Bookmaker / Platform...</option>';
    list.forEach(item => {
        const opt = document.createElement('option');
        opt.value = item.id || item.name;
        opt.textContent = item.name;
        select.appendChild(opt);
    });
}

document.getElementById('bettingForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btnSubmit');
    btn.disabled = true;
    btn.textContent = 'Processing Payment...';

    const modalBody = document.getElementById('modalBody');
    const providerId = document.getElementById('bookmakerSelect').value;
    const userId = document.getElementById('userId').value;
    const amount = parseFloat(document.getElementById('amount').value);
    const txRef = `BLSG-BET-${Date.now()}`;
    const selectedSourceBank = document.getElementById('sourceBankSelect').options[document.getElementById('sourceBankSelect').selectedIndex].text;

    const rawSession = localStorage.getItem('activeMerchant') || localStorage.getItem('merchantSession') || '{}';
    let merchant = {};
    try { merchant = JSON.parse(rawSession); } catch(err) {}

    // Pay via Wallet Balance
    if (selectedPayMethod === 'WALLET') {
        if (!merchant.phone) {
            modalBody.innerHTML = "<p style='color:#ef4444;'>❌ Please sign in to your merchant dashboard to pay via wallet balance.</p>";
            document.getElementById('customModal').style.display = 'flex';
            btn.disabled = false;
            btn.textContent = 'Proceed to Fund Wallet';
            return;
        }

        try {
            const res = await fetch('/api/v1/services/transact', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    merchantPhone: merchant.phone,
                    serviceType: `Betting Topup (${providerId})`,
                    recipient: userId,
                    amount: amount,
                    reference: txRef
                })
            });
            const data = await res.json();
            
            if (res.ok && data.status === 'success') {
                if (data.newBalance !== undefined) {
                    merchant.balance = data.newBalance;
                    localStorage.setItem('activeMerchant', JSON.stringify(merchant));
                }
                renderReceipt({
                    status: 'success',
                    orderRef: data.txRef || txRef,
                    serviceTitle: providerId,
                    recipient: userId,
                    amount: amount,
                    paymentMethod: 'Gateway Wallet Balance'
                });
            } else {
                renderReceipt({
                    status: 'declined',
                    orderRef: txRef,
                    serviceTitle: providerId,
                    recipient: userId,
                    amount: amount,
                    paymentMethod: 'Gateway Wallet Balance'
                });
            }
        } catch (err) {
            renderReceipt({
                status: 'declined',
                orderRef: txRef,
                serviceTitle: providerId,
                recipient: userId,
                amount: amount,
                paymentMethod: 'Gateway Wallet Balance'
            });
        }
        
        btn.disabled = false;
        btn.textContent = 'Proceed to Fund Wallet';
        return;
    }

    // Pay via External Checkout (Transfer / Card)
    try {
        const res = await fetch('/api/v1/checkout/initialize', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                serviceType: `Betting Topup (${providerId})`,
                targetInput: userId,
                amount: amount,
                paymentMethod: selectedPayMethod,
                sourceBank: selectedSourceBank,
                reference: txRef
            })
        });
        const data = await res.json();

        if (res.ok) {
            if (selectedPayMethod === 'TRANSFER') {
                modalBody.innerHTML = `
                    <div style="text-align:center;">
                        <h3 style="color:#38bdf8; margin-bottom:6px;">🏦 Squad Transfer & Release Clause</h3>
                        <p style="font-size:0.8rem; color:#cbd5e1; margin-bottom:8px;">Transfer from <strong>${selectedSourceBank}</strong> to:</p>
                        <div style="background:#0f172a; padding:12px; border-radius:8px; margin:10px 0; border:1px dashed #38bdf8;">
                            <p style="font-size:0.75rem; color:#94a3b8;">GTBank (Squad Engine)</p>
                            <p style="font-size:1.2rem; font-weight:800; color:#f59e0b; margin:4px 0;">3039182746</p>
                            <p style="font-size:0.85rem; color:#10b981; font-weight:700;">₦${amount.toLocaleString('en-NG')}</p>
                        </div>
                        <p style="font-size:0.7rem; color:#38bdf8;">Ref: <strong>${txRef}</strong></p>
                        <small style="color:#cbd5e1; display:block; margin-top:6px;">⚡ Instant automated wallet top-up upon payment credit!</small>
                    </div>
                `;
            } else if (data.checkoutUrl) {
                modalBody.innerHTML = `
                    <p>Click below to complete your payment via Card or USSD:</p>
                    <a href="${data.checkoutUrl}" target="_blank" style="display:inline-block; margin-top:15px; padding:12px 24px; background:#10b981; color:#fff; border-radius:8px; text-decoration:none; font-weight:800;">Open Card Gateway</a>
                `;
            } else {
                modalBody.innerText = data.message || "Payment initialized successfully.";
            }
        } else {
            renderReceipt({ status: 'declined', orderRef: txRef, serviceTitle: providerId, recipient: userId, amount: amount, paymentMethod: selectedPayMethod });
        }
    } catch (err) {
        renderReceipt({ status: 'declined', orderRef: txRef, serviceTitle: providerId, recipient: userId, amount: amount, paymentMethod: selectedPayMethod });
    }

    document.getElementById('customModal').style.display = 'flex';
    btn.disabled = false;
    btn.textContent = 'Proceed to Fund Wallet';
});

window.onload = loadBookmakers;
</script>

</body>
</html>
