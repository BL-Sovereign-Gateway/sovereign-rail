<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airtime & Data Top-Up | @BL SOVEREIGN GATEWAY</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { background: #1e293b; border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 30px; width: 100%; max-width: 500px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); }
        .header { text-align: center; margin-bottom: 20px; }
        .header h2 { color: #38bdf8; font-size: 1.5rem; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 0.85rem; color: #cbd5e1; margin-bottom: 6px; }
        input, select { width: 100%; padding: 12px; border-radius: 8px; background: #0f172a; border: 1px solid #334155; color: #fff; font-size: 0.95rem; outline: none; }
        .tab-group { display: flex; gap: 10px; margin-bottom: 16px; }
        .tab { flex: 1; padding: 10px; background: #0f172a; border: 1px solid #334155; text-align: center; border-radius: 8px; cursor: pointer; color: #94a3b8; font-weight: 600; }
        .tab.active { border-color: #38bdf8; color: #38bdf8; background: rgba(56, 189, 248, 0.1); }
        button.btn { width: 100%; padding: 14px; background: #0ea5e9; color: #fff; border: none; border-radius: 8px; font-weight: 700; font-size: 1rem; cursor: pointer; }
        button.btn:hover { background: #38bdf8; }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <h2>📱 AIRTIME & DATA TOP-UP</h2>
        <p style="font-size:0.85rem; color:#94a3b8; margin-top:4px;">Instant Recharge across MTN, Airtel, Glo & 9mobile</p>
    </div>

    <div class="tab-group">
        <div class="tab active" id="tabAirtime" onclick="setMode('AIRTIME')">Airtime</div>
        <div class="tab" id="tabData" onclick="setMode('DATA')">Data Bundle</div>
    </div>

    <form id="vtuForm">
        <div class="form-group">
            <label>Select Network Provider *</label>
            <select id="networkSelect" required onchange="handleNetworkChange()">
                <option value="MTN">MTN Nigeria</option>
                <option value="AIRTEL">Airtel Nigeria</option>
                <option value="GLO">Glo Nigeria</option>
                <option value="9MOBILE">9mobile Nigeria</option>
            </select>
        </div>

        <div class="form-group">
            <label>Phone Number *</label>
            <input type="tel" id="phoneInput" placeholder="08012345678" maxlength="11" required>
        </div>

        <div class="form-group" id="dataPlanGroup" style="display:none;">
            <label>Select Data Plan *</label>
            <select id="dataPlanSelect"></select>
        </div>

        <div class="form-group" id="amountGroup">
            <label>Amount (₦) *</label>
            <input type="number" id="vtuAmount" min="50" placeholder="e.g. 1000">
        </div>

        <button type="submit" class="btn">Proceed to Pay</button>
    </form>
</div>

<script>
    let activeMode = 'AIRTIME';
    let plansData = {};

    function setMode(mode) {
        activeMode = mode;
        document.getElementById('tabAirtime').classList.toggle('active', mode === 'AIRTIME');
        document.getElementById('tabData').classList.toggle('active', mode === 'DATA');
        
        document.getElementById('dataPlanGroup').style.display = (mode === 'DATA') ? 'block' : 'none';
        document.getElementById('amountGroup').style.display = (mode === 'AIRTIME') ? 'block' : 'none';
    }

    async function init() {
        const res = await fetch('/api/v1/vtu/providers');
        const data = await res.json();
        if (data.status === 'success') {
            plansData = data.plans;
            handleNetworkChange();
        }
    }

    function handleNetworkChange() {
        const network = document.getElementById('networkSelect').value;
        const planSelect = document.getElementById('dataPlanSelect');
        planSelect.innerHTML = '';

        if (plansData[network]) {
            plansData[network].forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.planId;
                opt.dataset.price = p.price;
                opt.textContent = `${p.name} - ₦${p.price}`;
                planSelect.appendChild(opt);
            });
        }
    }

    document.getElementById('vtuForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const network = document.getElementById('networkSelect').value;
        const phone = document.getElementById('phoneInput').value;
        
        let amount = document.getElementById('vtuAmount').value;
        let planId = null;

        if (activeMode === 'DATA') {
            const selectedOpt = document.getElementById('dataPlanSelect').selectedOptions[0];
            planId = selectedOpt.value;
            amount = selectedOpt.dataset.price;
        }

        const res = await fetch('/api/v1/vtu/initiate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ type: activeMode, network, phone, planId, amount })
        });

        const data = await res.json();
        if (data.status === 'success') {
            alert(`✅ Session Created! Ref: ${data.accountRef}\nProceeding to payment gateway...`);
        }
    });

    window.onload = init;
</script>

</body>
</html>
