<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airtime & Data Recharge | @BL SOVEREIGN GATEWAY</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        
        /* 2-COLUMN GRID CONTAINER FOR AIRTIME & DATA */
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            width: 100%;
            max-width: 980px;
        }

        .card { 
            background: #1e293b; 
            border: 1px solid #38bdf8; 
            border-radius: 16px; 
            padding: 28px; 
            box-shadow: 0 20px 25px rgba(0,0,0,0.5); 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .brand-header { text-align: center; margin-bottom: 20px; }
        .brand-header h2 { font-size: 1.25rem; font-weight: 800; color: #38bdf8; margin: 0; }
        .brand-header p { font-size: 0.72rem; color: #94a3b8; letter-spacing: 1px; margin-top: 3px; text-transform: uppercase; }

        .form-group { margin-bottom: 14px; }
        label { display: block; font-size: 0.85rem; color: #cbd5e1; margin-bottom: 6px; font-weight: 600; }
        input, select { width: 100%; padding: 12px; border-radius: 8px; background: #0f172a; border: 1px solid #334155; color: #fff; font-size: 0.9rem; outline: none; }
        input:focus, select:focus { border-color: #38bdf8; }

        .payment-options { display: flex; gap: 8px; margin: 15px 0; }
        .pay-option { flex: 1; padding: 10px 4px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; text-align: center; cursor: pointer; font-size: 0.75rem; font-weight: 600; color: #cbd5e1; }
        .pay-option.active { border-color: #38bdf8; color: #38bdf8; background: rgba(56, 189, 248, 0.1); }

        .btn-submit { width: 100%; padding: 14px; background: #10b981; color: #fff; border: none; border-radius: 8px; font-weight: 800; cursor: pointer; font-size: 0.95rem; margin-top: 10px; }
        .btn-submit:hover { background: #059669; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; z-index: 1000; }
        .modal-box { background: #1e293b; border: 1px solid #38bdf8; border-radius: 16px; padding: 24px; width: 90%; max-width: 440px; text-align: center; }
        .modal-btn { background: #0ea5e9; color: #fff; border: none; padding: 10px 24px; border-radius: 8px; font-weight: 700; cursor: pointer; margin-top: 12px; }

        @media (max-width: 768px) {
            .grid-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="grid-container">

    <!-- COLUMN 1: INSTANT AIRTIME RECHARGE -->
    <div class="card">
        <div class="brand-header">
            <h2>📞 INSTANT AIRTIME</h2>
            <p>ALL TIME BUSINESS LTD | @BL SOVEREIGN GATEWAY</p>
        </div>

        <form id="airtimeForm">
            <div class="form-group">
                <label>Select Network Operator *</label>
                <select id="airtimeNetworkSelect" required>
                    <option value="MTN Nigeria">MTN Nigeria</option>
                    <option value="Airtel Nigeria">Airtel Nigeria</option>
                    <option value="Glo Nigeria">Glo Nigeria</option>
                    <option value="9mobile Nigeria">9mobile Nigeria</option>
                </select>
            </div>

            <div class="form-group">
                <label>Phone Number *</label>
                <input type="tel" id="airtimePhoneNumber" placeholder="08012345678" maxlength="11" required>
            </div>

            <div class="form-group">
                <label>Airtime Amount (₦) *</label>
                <input type="number" id="airtimeAmount" placeholder="1000" min="100" required>
            </div>

            <label>Payment Method</label>
            <div class="payment-options">
                <div class="pay-option active" onclick="setPayMethod('WALLET', this, 'AIRTIME')">💼 Wallet</div>
                <div class="pay-option" onclick="setPayMethod('TRANSFER', this, 'AIRTIME')">🏦 Transfer</div>
                <div class="pay-option" onclick="setPayMethod('CARD', this, 'AIRTIME')">💳 Card/USSD</div>
            </div>

            <!-- COMPLETE NIGERIAN BANKS DROPDOWN FOR AIRTIME TRANSFER -->
            <div class="form-group" id="airtimeBankGroup" style="display:none; margin-top:12px;">
                <label>Select Source / Transfer Bank *</label>
                <select id="airtimeSourceBank">
                    <optgroup label="Commercial Banks">
                        <option value="ACCESS">Access Bank</option>
                        <option value="FBN">First Bank of Nigeria</option>
                        <option value="GTB">Guaranty Trust Bank (GTBank)</option>
                        <option value="ZENITH">Zenith Bank Plc</option>
                        <option value="UBA">United Bank for Africa (UBA)</option>
                        <option value="FCMB">First City Monument Bank (FCMB)</option>
                        <option value="FIDELITY">Fidelity Bank</option>
                        <option value="STANBIC">Stanbic IBTC Bank</option>
                        <option value="STERLING">Sterling Bank</option>
                        <option value="UNION">Union Bank of Nigeria</option>
                        <option value="WEMA">Wema Bank</option>
                        <option value="POLARIS">Polaris Bank</option>
                    </optgroup>
                    <optgroup label="Digital Fintechs & MFBs">
                        <option value="OPAY">OPay Digital Services</option>
                        <option value="PALMPAY">PalmPay</option>
                        <option value="MONIEPOINT">Moniepoint MFB</option>
                        <option value="KUDA">Kuda MFB</option>
                        <option value="VFD">VFD Microfinance Bank</option>
                    </optgroup>
                </select>
            </div>

            <button type="submit" class="btn-submit" id="airtimeSubmitBtn">Buy Airtime</button>
        </form>
    </div>

    <!-- COLUMN 2: MOBILE DATA BUNDLES (WITH AFFORDABLE DAILY/SHORT-TERM PLANS) -->
    <div class="card">
        <div class="brand-header">
            <h2>📶 MOBILE DATA BUNDLES</h2>
            <p>ALL TIME BUSINESS LTD | @BL SOVEREIGN GATEWAY</p>
        </div>

        <form id="dataForm">
            <div class="form-group">
                <label>Select Network Operator *</label>
                <select id="dataNetworkSelect" required onchange="updateDataPlans()">
                    <option value="MTN Nigeria">MTN Nigeria</option>
                    <option value="Airtel Nigeria">Airtel Nigeria</option>
                    <option value="Glo Nigeria">Glo Nigeria</option>
                    <option value="9mobile Nigeria">9mobile Nigeria</option>
                </select>
            </div>

            <div class="form-group">
                <label>Select Data Plan (Daily, Short-Term & Monthly) *</label>
                <select id="dataPlanSelect" required>
                    <!-- Dynamically Populated -->
                </select>
            </div>

            <div class="form-group">
                <label>Recipient Phone Number *</label>
                <input type="tel" id="dataPhoneNumber" placeholder="08012345678" maxlength="11" required>
            </div>

            <label>Payment Method</label>
            <div class="payment-options">
                <div class="pay-option active" onclick="setPayMethod('WALLET', this, 'DATA')">💼 Wallet</div>
                <div class="pay-option" onclick="setPayMethod('TRANSFER', this, 'DATA')">🏦 Transfer</div>
                <div class="pay-option" onclick="setPayMethod('CARD', this, 'DATA')">💳 Card/USSD</div>
            </div>

            <!-- COMPLETE NIGERIAN BANKS DROPDOWN FOR DATA TRANSFER -->
            <div class="form-group" id="dataBankGroup" style="display:none; margin-top:12px;">
                <label>Select Source / Transfer Bank *</label>
                <select id="dataSourceBank">
                    <optgroup label="Commercial Banks">
                        <option value="ACCESS">Access Bank</option>
                        <option value="FBN">First Bank of Nigeria</option>
                        <option value="GTB">Guaranty Trust Bank (GTBank)</option>
                        <option value="ZENITH">Zenith Bank Plc</option>
                        <option value="UBA">United Bank for Africa (UBA)</option>
                        <option value="FCMB">First City Monument Bank (FCMB)</option>
                        <option value="FIDELITY">Fidelity Bank</option>
                        <option value="STANBIC">Stanbic IBTC Bank</option>
                        <option value="STERLING">Sterling Bank</option>
                        <option value="UNION">Union Bank of Nigeria</option>
                        <option value="WEMA">Wema Bank</option>
                        <option value="POLARIS">Polaris Bank</option>
                    </optgroup>
                    <optgroup label="Digital Fintechs & MFBs">
                        <option value="OPAY">OPay Digital Services</option>
                        <option value="PALMPAY">PalmPay</option>
                        <option value="MONIEPOINT">Moniepoint MFB</option>
                        <option value="KUDA">Kuda MFB</option>
                        <option value="VFD">VFD Microfinance Bank</option>
                    </optgroup>
                </select>
            </div>

            <button type="submit" class="btn-submit" id="dataSubmitBtn">Purchase Data Bundle</button>
        </form>
    </div>

</div>

<!-- Universal Modal Popup for Receipts & Transfer Instructions -->
<div class="modal-overlay" id="customModal">
    <div class="modal-box">
        <h3 style="color:#38bdf8; margin-bottom:12px;">@BL SOVEREIGN GATEWAY</h3>
        <div id="modalBody" style="font-size:0.9rem; color:#cbd5e1; line-height:1.5; margin-bottom:15px; text-align:left;"></div>
        <button class="modal-btn" onclick="closeModal()">Close</button>
    </div>
</div>

<script>
let selectedPayMethodAirtime = 'WALLET';
let selectedPayMethodData = 'WALLET';

// Affordable VTU Data Plans Map (Daily, 2-Days, 3-Days, Weekly & Monthly)
const dataPlans = {
    "MTN Nigeria": [
        { plan: "100MB Daily Plan (24 Hours)", price: 100 },
        { plan: "350MB 2-Day Plan", price: 200 },
        { plan: "750MB 3-Day Plan", price: 500 },
        { plan: "1.0GB Weekly Plan (7 Days)", price: 350 },
        { plan: "1.0GB SME Data (30 Days)", price: 300 },
        { plan: "2.0GB SME Data (30 Days)", price: 600 },
        { plan: "5.0GB SME Data (30 Days)", price: 1500 }
    ],
    "Airtel Nigeria": [
        { plan: "100MB Daily Plan (24 Hours)", price: 100 },
        { plan: "300MB 2-Day Plan", price: 200 },
        { plan: "750MB 14-Day Plan", price: 500 },
        { plan: "1.5GB Monthly Data (30 Days)", price: 1000 },
        { plan: "3.0GB Monthly Data (30 Days)", price: 1500 }
    ],
    "Glo Nigeria": [
        { plan: "150MB Daily Plan (24 Hours)", price: 100 },
        { plan: "350MB 2-Day Plan", price: 200 },
        { plan: "1.05GB Evening/Weekend Plan", price: 500 },
        { plan: "1.35GB Monthly Data (30 Days)", price: 500 },
        { plan: "2.9GB Monthly Data (30 Days)", price: 1000 }
    ],
    "9mobile Nigeria": [
        { plan: "100MB Daily Plan (24 Hours)", price: 100 },
        { plan: "650MB 7-Day Weekly Plan", price: 500 },
        { plan: "1.0GB Monthly Data (30 Days)", price: 1000 },
        { plan: "2.5GB Monthly Data (30 Days)", price: 1500 }
    ]
};

function updateDataPlans() {
    const network = document.getElementById('dataNetworkSelect').value;
    const planSelect = document.getElementById('dataPlanSelect');
    planSelect.innerHTML = '';
    
    (dataPlans[network] || []).forEach(p => {
        const opt = document.createElement('option');
        opt.value = p.price;
        opt.dataset.planName = p.plan;
        opt.textContent = `${p.plan} — ₦${p.price.toLocaleString('en-NG')}`;
        planSelect.appendChild(opt);
    });
}

function setPayMethod(method, el, section) {
    if (section === 'AIRTIME') {
        selectedPayMethodAirtime = method;
        document.getElementById('airtimeBankGroup').style.display = (method === 'TRANSFER') ? 'block' : 'none';
    } else {
        selectedPayMethodData = method;
        document.getElementById('dataBankGroup').style.display = (method === 'TRANSFER') ? 'block' : 'none';
    }
    el.parentElement.querySelectorAll('.pay-option').forEach(opt => opt.classList.remove('active'));
    el.classList.add('active');
}

function closeModal() {
    document.getElementById('customModal').style.display = 'none';
}

updateDataPlans();

/* ==========================================
   1. AIRTIME FORM SUBMISSION
   ========================================== */
document.getElementById('airtimeForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('airtimeSubmitBtn');
    btn.disabled = true;
    btn.textContent = 'Processing...';

    const rawSession = localStorage.getItem('activeMerchant') || localStorage.getItem('merchantSession') || '{}';
    let merchant = {};
    try { merchant = JSON.parse(rawSession); } catch(err) {}

    const modalBody = document.getElementById('modalBody');
    const network = document.getElementById('airtimeNetworkSelect').value;
    const phone = document.getElementById('airtimePhoneNumber').value;
    const amount = parseFloat(document.getElementById('airtimeAmount').value);
    const txRef = `BLSG-AIR-${Date.now()}`;
    const selectedSourceBank = document.getElementById('airtimeSourceBank').options[document.getElementById('airtimeSourceBank').selectedIndex].text;

    try {
        if (selectedPayMethodAirtime === 'WALLET') {
            if (!merchant.phone) {
                modalBody.innerHTML = `<p style="color:#ef4444;">❌ Please sign in to your merchant dashboard to pay via wallet balance.</p>`;
                document.getElementById('customModal').style.display = 'flex';
                btn.disabled = false;
                btn.textContent = 'Buy Airtime';
                return;
            }

            let res = await fetch('/api/v1/checkout/wallet', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    merchantPhone: merchant.phone,
                    serviceType: `Airtime (${network})`,
                    targetInput: phone,
                    amount: amount,
                    reference: txRef
                })
            });

            if (!res.ok) {
                res = await fetch('/api/v1/services/transact', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        merchantPhone: merchant.phone,
                        serviceType: `Airtime (${network})`,
                        recipient: phone,
                        amount: amount,
                        reference: txRef
                    })
                });
            }

            const data = await res.json();

            if (res.ok && (data.status === 'success' || data.success)) {
                if (data.newBalance !== undefined) {
                    merchant.balance = data.newBalance;
                    localStorage.setItem('activeMerchant', JSON.stringify(merchant));
                }
                modalBody.innerHTML = `
                    <div style="background:#0f172a; padding:14px; border-radius:10px; border:1px solid #10b981;">
                        <p style="color:#10b981; font-weight:800; margin-bottom:6px;">✅ AIRTIME RECHARGE SUCCESSFUL</p>
                        <p style="font-size:0.85rem; color:#cbd5e1;"><strong>Ref:</strong> <span style="color:#38bdf8;">${data.txRef || txRef}</span></p>
                        <p style="font-size:0.85rem; color:#cbd5e1;"><strong>Network:</strong> ${network}</p>
                        <p style="font-size:0.85rem; color:#cbd5e1;"><strong>Recipient:</strong> ${phone}</p>
                        <p style="font-size:0.85rem; color:#cbd5e1;"><strong>Amount:</strong> ₦${amount.toLocaleString('en-NG', {minimumFractionDigits:2})}</p>
                        <p style="font-size:0.7rem; color:#94a3b8; margin-top:8px; border-top:1px dashed #334155; pt:4px;">Squad Gateway Verified & Auto-Released</p>
                    </div>
                `;
            } else {
                modalBody.innerHTML = `
                    <div style="background:#0f172a; padding:14px; border-radius:10px; border:1px solid #ef4444;">
                        <p style="color:#ef4444; font-weight:800; margin-bottom:6px;">❌ TRANSACTION DECLINED</p>
                        <p style="font-size:0.85rem; color:#cbd5e1;"><strong>Ref:</strong> ${txRef}</p>
                        <p style="font-size:0.85rem; color:#cbd5e1;">⚠️ ${data.message || 'Insufficient wallet balance.'}</p>
                    </div>
                `;
            }
            document.getElementById('customModal').style.display = 'flex';
        } else {
            const res = await fetch('/api/v1/checkout/initialize', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    serviceType: `Airtime (${network})`,
                    targetInput: phone,
                    amount: amount,
                    paymentMethod: selectedPayMethodAirtime,
                    sourceBank: selectedSourceBank,
                    reference: txRef
                })
            });
            const data = await res.json();

            if (res.ok) {
                modalBody.innerHTML = `
                    <div style="text-align:center;">
                        <h3 style="color:#38bdf8; margin-bottom:6px;">🏦 Squad Transfer & Release Clause</h3>
                        <p style="font-size:0.8rem; color:#cbd5e1; margin-bottom:8px;">Transfer from <strong>${selectedSourceBank}</strong> to:</p>
                        <div style="background:#0f172a; padding:12px; border-radius:8px; margin:10px 0; border:1px dashed #38bdf8;">
                            <p style="font-size:0.75rem; color:#94a3b8;">GTBank (Squad Engine)</p>
                            <p style="font-size:1.2rem; font-weight:800; color:#f59e0b; margin:4px 0;">3039182746</p>
                            <p style="font-size:0.85rem; color:#10b981; font-weight:700;">₦${amount.toLocaleString('en-NG')}</p>
                        </div>
                        <p style="font-size:0.7rem; color:#38bdf8;">Ref: <strong>${txRef}</strong></p>
                        <small style="color:#cbd5e1; display:block; margin-top:6px;">⚡ Airtime dispatches automatically upon credit confirmation!</small>
                    </div>
                `;
            } else {
                modalBody.innerHTML = `<p style="color:#ef4444;">⚠️ Unable to initialize checkout.</p>`;
            }
            document.getElementById('customModal').style.display = 'flex';
        }
    } catch (err) {
        modalBody.innerHTML = `<p style="color:#ef4444;">❌ Network connection error. Please try again.</p>`;
        document.getElementById('customModal').style.display = 'flex';
    }

    btn.disabled = false;
    btn.textContent = 'Buy Airtime';
});

/* ==========================================
   2. DATA BUNDLE FORM SUBMISSION
   ========================================== */
document.getElementById('dataForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('dataSubmitBtn');
    btn.disabled = true;
    btn.textContent = 'Processing...';

    const rawSession = localStorage.getItem('activeMerchant') || localStorage.getItem('merchantSession') || '{}';
    let merchant = {};
    try { merchant = JSON.parse(rawSession); } catch(err) {}

    const network = document.getElementById('dataNetworkSelect').value;

    const planName = planSelect.options[planSelect.selectedIndex].dataset.planName;

    try {
        if (selectedPayMethodData === 'WALLET') {
            if (!merchant.phone) {
                modalBody.innerHTML = `<p style="color:#ef4444;">❌ Please sign in to your merchant dashboard to pay via wallet balance.</p>`;

            }

                })

            if (!res.ok) {
                res = await fetch('/api/v1/services/transact', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        merchantPhone: merchant.phone,
                        serviceType: `Data (${network} - ${planName})`,
                        recipient: phone,

                    })
                });
            }

            const data = await res.json();

            if (res.ok && (data.status === 'success' || data.success)) {
                if (data.newBalance !== undefined) {
                    merchant.balance = data.newBalance;
                    localStorage.setItem('activeMerchant', JSON.stringify(merchant));
                }
                modalBody.innerHTML = `
                    <div style="background:#0f172a; padding:14px; border-radius:10px; border:1px solid #10b981;">
                        <p style="color:#10b981; font-weight:800; margin-bottom:6px;">✅ DATA BUNDLE DISPATCHED</p>
                        <p style="font-size:0.85rem; color:#cbd5e1;"><strong>Data Ref:</strong> <span style="color:#38bdf8;">${data.txRef || txRef}</span></p>
                        <p style="font-size:0.85rem; color:#cbd5e1;"><strong>Network:</strong> ${network}</p>
                        <p style="font-size:0.85rem; color:#cbd5e1;"><strong>Plan:</strong> ${planName}</p>
                        <p style="font-size:0.85rem; color:#cbd5e1;"><strong>Recipient:</strong> ${phone}</p>
                        <p style="font-size:0.85rem; color:#cbd5e1;"><strong>Amount:</strong> ₦${amount.toLocaleString('en-NG', {minimumFractionDigits:2})}</p>
                        <p style="font-size:0.7rem; color:#94a3b8; margin-top:8px; border-top:1px dashed #334155; pt:4px;">Squad Gateway Verified & Auto-Released</p>
                    </div>
                `;
            } else {
                modalBody.innerHTML = `
                    <div style="background:#0f172a; padding:14px; border-radius:10px; border:1px solid #ef4444;">
                        <p style="color:#ef4444; font-weight:800; margin-bottom:6px;">❌ TRANSACTION DECLINED</p>
                        <p style="font-size:0.85rem; color:#cbd5e1;"><strong>Data Ref:</strong> ${txRef}</p>
                        <p style="font-size:0.85rem; color:#cbd5e1;">⚠️ ${data.message || 'Insufficient wallet balance.'}</p>
                    </div>
                `;
            }
            document.getElementById('customModal').style.display = 'flex';
        } else {
            const res = await fetch('/api/v1/checkout/initialize', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    serviceType: `Data (${network} - ${planName})`,
                    targetInput: phone,
                    amount: amount,
                    paymentMethod: selectedPayMethodData,
                    sourceBank: selectedSourceBank,
                    reference: txRef
                })
            });
            const data = await res.json();

            if (res.ok) {
                modalBody.innerHTML = `
                    <div style="text-align:center;">
                        <h3 style="color:#38bdf8; margin-bottom:6px;">🏦 Squad Transfer & Release Clause</h3>
                        <p style="font-size:0.8rem; color:#cbd5e1; margin-bottom:8px;">Transfer from <strong>${selectedSourceBank}</strong> to:</p>
                        <div style="background:#0f172a; padding:12px; border-radius:8px; margin:10px 0; border:1px dashed #38bdf8;">
                            <p style="font-size:0.75rem; color:#94a3b8;">GTBank (Squad Engine)</p>
                            <p style="font-size:1.2rem; font-weight:800; color:#f59e0b; margin:4px 0;">3039182746</p>
                            <p style="font-size:0.85rem; color:#10b981; font-weight:700;">₦${amount.toLocaleString('en-NG')}</p>
                        </div>
                        <p style="font-size:0.7rem; color:#38bdf8;">Data Ref: <strong>${txRef}</strong></p>
                        <small style="color:#cbd5e1; display:block; margin-top:6px;">⚡ Data bundle dispatches automatically upon credit confirmation!</small>
                    </div>
                `;
            } else {
                modalBody.innerHTML = `<p style="color:#ef4444;">⚠️ Unable to initialize checkout.</p>`;
            }
            document.getElementById('customModal').style.display = 'flex';
        }
    } catch (err) {
        modalBody.innerHTML = `<p style="color:#ef4444;">❌ Network connection error. Please try again.</p>`;
        document.getElementById('customModal').style.display = 'flex';
    }

    btn.disabled = false;
    btn.textContent = 'Purchase Data Bundle';
});
</script>

</body>
</html>
