<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merchant Sign In | @BL SOVEREIGN GATEWAY</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { background: #1e293b; border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 30px; width: 100%; max-width: 440px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); }
        .header { text-align: center; margin-bottom: 24px; }
        .header h2 { color: #38bdf8; font-size: 1.5rem; margin-bottom: 6px; }
        .header p { color: #94a3b8; font-size: 0.85rem; }
        
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 0.85rem; color: #cbd5e1; margin-bottom: 6px; }
        input { width: 100%; padding: 12px; border-radius: 8px; background: #0f172a; border: 1px solid #334155; color: #fff; font-size: 0.95rem; outline: none; }
        input:focus { border-color: #38bdf8; }
        button.btn { width: 100%; padding: 14px; background: #38bdf8; color: #0f172a; border: none; border-radius: 8px; font-weight: 800; font-size: 1rem; cursor: pointer; margin-top: 10px; transition: background 0.2s ease; }
        button.btn:hover { background: #0ea5e9; color: #fff; }

        .auth-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.85rem;
            color: #94a3b8;
        }
        .auth-footer a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: 700;
        }
        .auth-footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <h2>🔐 MERCHANT SIGN IN</h2>
        <p>Access your @BL Sovereign Gateway Desk</p>
    </div>

    <form id="loginForm">
        <div class="form-group">
            <label>Phone Number (Username) *</label>
            <input type="tel" id="phone" placeholder="08022552528" required>
        </div>

        <div class="form-group">
            <label>Account Password *</label>
            <input type="password" id="password" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn">Sign In to Dashboard</button>
    </form>

    <div class="auth-footer">
        Don't have an account yet? <a href="/register">Sign Up (Onboarding)</a>
    </div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const payload = {
        phone: document.getElementById('phone').value.trim(),
        password: document.getElementById('password').value
    };

    try {
        const response = await fetch('/api/v1/auth/signin', {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json',
                'Accept': 'application/json' 
            },
            body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (response.ok && result.status === 'success') {
            alert('🎉 Sign in successful! Redirecting to dashboard...');
            localStorage.setItem('activeMerchant', JSON.stringify(result.merchant));
            window.location.href = '/dashboard';
        } else {
            alert(`Error: ${result.message || 'Invalid credentials'}`);
        }
    } catch (err) {
        console.error('Sign in submit error:', err);
        alert('Failed to connect to authentication server.');
    }
});
</script>

</body>
</html>
