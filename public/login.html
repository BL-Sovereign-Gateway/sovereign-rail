<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merchant Access | @BL SOVEREIGN GATEWAY</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { background: #1e293b; border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 30px; width: 100%; max-width: 480px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); }
        .tabs { display: flex; margin-bottom: 20px; border-bottom: 1px solid #334155; }
        .tab { flex: 1; text-align: center; padding: 12px; cursor: pointer; color: #94a3b8; font-weight: 600; font-size: 0.9rem; }
        .tab.active { color: #38bdf8; border-bottom: 2px solid #38bdf8; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 0.85rem; color: #cbd5e1; margin-bottom: 6px; }
        input { width: 100%; padding: 12px; border-radius: 8px; background: #0f172a; border: 1px solid #334155; color: #fff; outline: none; }
        input:focus { border-color: #38bdf8; }
        .btn { width: 100%; padding: 14px; background: #0ea5e9; color: #fff; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; margin-top: 10px; }
        .btn:hover { background: #38bdf8; }
        .form-section { display: none; }
        .form-section.active { display: block; }
        .forgot-link { font-size: 0.8rem; color: #38bdf8; text-align: right; cursor: pointer; margin-top: 6px; display: block; }

        /* Branded Modal Box */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); align-items: center; justify-content: center; z-index: 1000; }
        .modal-box { background: #1e293b; border: 1px solid #38bdf8; border-radius: 16px; padding: 24px; width: 90%; max-width: 420px; text-align: center; box-shadow: 0 20px 25px rgba(0,0,0,0.8); }
        .modal-header { font-size: 1.1rem; font-weight: 700; color: #38bdf8; margin-bottom: 12px; border-bottom: 1px solid #334155; padding-bottom: 8px; }
        .modal-body { font-size: 0.9rem; color: #cbd5e1; line-height: 1.5; margin-bottom: 20px; white-space: pre-line; }
        .modal-btn { background: #0ea5e9; color: #fff; border: none; padding: 10px 24px; border-radius: 8px; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>

<div class="card">
    <div class="tabs">
        <div class="tab active" onclick="switchTab('signin')">Sign In</div>
        <div class="tab" onclick="switchTab('signup')">Sign Up</div>
    </div>

    <!-- SIGN IN FORM -->
    <div id="signin" class="form-section active">
        <form id="signInForm">
            <div class="form-group">
                <label>Registered Phone Number (Username) *</label>
                <input type="tel" id="loginPhone" placeholder="08012345678" required>
            </div>
            <div class="form-group">
                <label>Password *</label>
                <input type="password" id="loginPassword" placeholder="••••••••" required>
                <span class="forgot-link" onclick="switchTab('reset')">Forgot Password?</span>
            </div>
            <button type="submit" class="btn">Sign In to Dashboard</button>
        </form>
    </div>

    <!-- SIGN UP FORM -->
    <div id="signup" class="form-section">
        <form id="signUpForm">
            <div class="form-group">
                <label>Business / Merchant Name *</label>
                <input type="text" id="regName" placeholder="e.g. Sovereign Traders" required>
            </div>
            <div class="form-group">
                <label>Phone Number (Username) *</label>
                <input type="tel" id="regPhone" placeholder="08012345678" required>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="regEmail" placeholder="merchant@business.com">
            </div>
            <div class="form-group">
                <label>Password *</label>
                <input type="password" id="regPassword" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn">Create Merchant Account</button>
        </form>
    </div>

    <!-- RESET PASSWORD FORM -->
    <div id="reset" class="form-section">
        <form id="resetForm">
            <div class="form-group">
                <label>Registered Phone Number *</label>
                <input type="tel" id="resetPhone" placeholder="08012345678" required>
            </div>
            <div class="form-group">
                <label>New Password *</label>
                <input type="password" id="resetNewPass" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn">Reset Password</button>
        </form>
    </div>
</div>

<!-- CUSTOM BRANDED MODAL -->
<div class="modal-overlay" id="customModal">
    <div class="modal-box">
        <div class="modal-header">@BL SOVEREIGN GATEWAY</div>
        <div class="modal-body" id="modalText">Message goes here...</div>
        <button class="modal-btn" onclick="closeModal()">OK</button>
    </div>
</div>

<script>
function showModal(msg, callback) {
    document.getElementById('modalText').innerText = msg;
    document.getElementById('customModal').style.display = 'flex';
    window.modalCallback = callback;
}

function closeModal() {
    document.getElementById('customModal').style.display = 'none';
    if (window.modalCallback) {
        window.modalCallback();
        window.modalCallback = null;
    }
}

function switchTab(tabId) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.form-section').forEach(s => s.classList.remove('active'));
    if (tabId === 'signin') document.querySelectorAll('.tab')[0].classList.add('active');
    if (tabId === 'signup') document.querySelectorAll('.tab')[1].classList.add('active');
    document.getElementById(tabId).classList.add('active');
}

// Sign Up
document.getElementById('signUpForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const payload = {
        merchantName: document.getElementById('regName').value,
        phone: document.getElementById('regPhone').value,
        email: document.getElementById('regEmail').value,
        password: document.getElementById('regPassword').value
    };
    try {
        const res = await fetch('/api/v1/auth/signup', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });
        const data = await res.json();
        
        if(data.status === 'success') {
            showModal(`🎉 Registration successful!\n\nWelcome to @BL SOVEREIGN GATEWAY.\n\nKindly check your email address (${payload.email}) for onboarding details and proceed to sign in.`, () => {
                switchTab('signin');
                document.getElementById('loginPhone').value = payload.phone;
            });
        } else {
            showModal(data.message);
        }
    } catch(err) {
        showModal('Registration failed. Please check your network connection.');
    }
});

// Sign In
document.getElementById('signInForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const payload = {
        phone: document.getElementById('loginPhone').value,
        password: document.getElementById('loginPassword').value
    };
    try {
        const res = await fetch('/api/v1/auth/signin', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });
        const data = await res.json();
        if(data.status === 'success') {
            localStorage.setItem('merchantSession', JSON.stringify(data.merchant));
            window.location.href = '/dashboard';
        } else {
            showModal(data.message);
        }
    } catch(err) {
        showModal('Sign in failed. Check network connection.');
    }
});

// Reset Password
document.getElementById('resetForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const payload = {
        phone: document.getElementById('resetPhone').value,
        newPassword: document.getElementById('resetNewPass').value
    };
    const res = await fetch('/api/v1/auth/reset-password', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });
    const data = await res.json();
    showModal(data.message, () => {
        if(data.status === 'success') switchTab('signin');
    });
});
</script>

</body>
</html>
