<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merchant Portal | @BL SOVEREIGN GATEWAY</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .auth-card { background: #1e293b; border: 1px solid #38bdf8; border-radius: 16px; padding: 30px; width: 100%; max-width: 480px; box-shadow: 0 20px 25px rgba(0,0,0,0.5); }
        .brand-header { text-align: center; margin-bottom: 20px; }
        .brand-header h2 { font-size: 1.4rem; font-weight: 800; color: #38bdf8; margin: 0; }
        .brand-header p { font-size: 0.75rem; color: #94a3b8; letter-spacing: 1px; margin-top: 2px; text-transform: uppercase; }

        .tab-group { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; text-align: center; cursor: pointer; font-size: 0.85rem; font-weight: 700; color: #cbd5e1; }
        .tab-btn.active { border-color: #38bdf8; color: #38bdf8; background: rgba(56, 189, 248, 0.1); }

        .form-group { margin-bottom: 14px; }
        label { display: block; font-size: 0.85rem; color: #cbd5e1; margin-bottom: 6px; }
        input, select { width: 100%; padding: 12px; border-radius: 8px; background: #0f172a; border: 1px solid #334155; color: #fff; font-size: 0.9rem; outline: none; }
        input:focus, select:focus { border-color: #38bdf8; }

        .btn-submit { width: 100%; padding: 14px; background: #10b981; color: #fff; border: none; border-radius: 8px; font-weight: 800; cursor: pointer; font-size: 1rem; margin-top: 10px; }
        .btn-submit:hover { background: #059669; }

        .alert-box { display: none; padding: 12px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 15px; text-align: center; }
        .alert-error { background: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444; color: #f87171; }
        .alert-success { background: rgba(16, 185, 129, 0.1); border: 1px solid #10b981; color: #34d399; }
    </style>
</head>
<body>

<div class="auth-card">
    <div class="brand-header">
        <h2>⚡ @BL SOVEREIGN GATEWAY</h2>
        <p>ALL TIME BUSINESS LTD | MERCHANT PORTAL</p>
    </div>

    <div class="tab-group">
        <div class="tab-btn active" id="tabSignIn" onclick="switchTab('SIGNIN')">Sign In</div>
        <div class="tab-btn" id="tabSignUp" onclick="switchTab('SIGNUP')">Sign Up (Onboarding)</div>
    </div>

    <div id="alertBox" class="alert-box"></div>

    <!-- SIGN IN FORM -->
    <form id="signInForm">
        <div class="form-group">
            <label>Phone Number (Username) *</label>
            <input type="text" id="loginPhone" placeholder="08012345678" required>
        </div>
        <div class="form-group">
            <label>Password *</label>
            <input type="password" id="loginPassword" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-submit">Sign In to Dashboard</button>
    </form>

    <!-- SIGN UP FORM -->
    <form id="signUpForm" style="display: none;">
        <div class="form-group">
            <label>Business / Merchant Name *</label>
            <input type="text" id="merchantName" placeholder="e.g. Sovereign Enterprises" required>
        </div>
        <div class="form-group">
            <label>Phone Number (Username) *</label>
            <input type="text" id="phone" placeholder="08012345678" required>
        </div>
        <div class="form-group">
            <label>Email Address (for onboarding alerts) *</label>
            <input type="email" id="email" placeholder="you@domain.com" required>
        </div>
        <div class="form-group">
            <label>Settlement Bank Name *</label>
            <select id="bankName" required>
                <option value="">Loading 30+ Commercial Banks...</option>
            </select>
        </div>
        <div class="form-group">
            <label>Settlement Account Number (10 Digits) *</label>
            <input type="text" id="settlementAccount" maxlength="10" placeholder="0037323182" required>
        </div>
        <div class="form-group">
            <label>Password *</label>
            <input type="password" id="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-submit">Complete Merchant Onboarding</button>
    </form>
</div>

<script>
const FULL_BANKS_STATIC = [
    'Access Bank Plc', 'Guaranty Trust Bank (GTBank)', 'Zenith Bank Plc', 'United Bank for Africa (UBA)',
    'First Bank of Nigeria', 'Fidelity Bank', 'First City Monument Bank (FCMB)', 'Stanbic IBTC Bank',
    'Wema Bank (ALAT)', 'Sterling Bank', 'Union Bank of Nigeria', 'Ecobank Nigeria', 'Polaris Bank',
    'Keystone Bank', 'Unity Bank', 'Jaiz Bank', 'OPTIMUS Bank', 'Providus Bank', 'Titan Trust Bank',
    'Globus Bank', 'OPay Digital Services', 'Palmpay', 'Kuda Microfinance Bank', 'Moniepoint MFB',
    'FairMoney MFB', 'Rubies MFB', 'VFD Microfinance Bank', 'Carbon MFB', 'Nomba MFB'
];

window.onload = () => {
    // Auto-Redirect if Session Exists
    const existingSession = localStorage.getItem('merchantSession');
    if (existingSession) {
        window.location.href = '/dashboard';
        return;
    }

    // Populate Banks
    const bankSelect = document.getElementById('bankName');
    bankSelect.innerHTML = '<option value="">Select Settlement Bank...</option>';
    FULL_BANKS_STATIC.forEach(b => {
        const opt = document.createElement('option');
        opt.value = b;
        opt.textContent = b;
        bankSelect.appendChild(opt);
    });
};

function switchTab(tab) {
    document.getElementById('alertBox').style.display = 'none';
    if (tab === 'SIGNIN') {
        document.getElementById('tabSignIn').classList.add('active');
        document.getElementById('tabSignUp').classList.remove('active');
        document.getElementById('signInForm').style.display = 'block';
        document.getElementById('signUpForm').style.display = 'none';
    } else {
        document.getElementById('tabSignUp').classList.add('active');
        document.getElementById('tabSignIn').classList.remove('active');
        document.getElementById('signUpForm').style.display = 'block';
        document.getElementById('signInForm').style.display = 'none';
    }
}

function showAlert(message, type) {
    const box = document.getElementById('alertBox');
    box.className = `alert-box ${type === 'success' ? 'alert-success' : 'alert-error'}`;
    box.textContent = message;
    box.style.display = 'block';
}

document.getElementById('signInForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const phone = document.getElementById('loginPhone').value;
    const password = document.getElementById('loginPassword').value;

    try {
        const res = await fetch('/api/v1/auth/signin', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ phone, password })
        });
        const data = await res.json();

        if (data.status === 'success') {
            localStorage.setItem('merchantSession', JSON.stringify(data.merchant));
            showAlert('🎉 Login successful! Redirecting...', 'success');
            setTimeout(() => { window.location.href = '/dashboard'; }, 800);
        } else {
            showAlert(data.message || 'Invalid credentials.', 'error');
        }
    } catch (err) {
        showAlert('Network connection error. Please try again.', 'error');
    }
});

document.getElementById('signUpForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const merchantName = document.getElementById('merchantName').value;
    const phone = document.getElementById('phone').value;
    const email = document.getElementById('email').value;
    const bankName = document.getElementById('bankName').value;
    const settlementAccount = document.getElementById('settlementAccount').value;
    const password = document.getElementById('password').value;

    try {
        const res = await fetch('/api/v1/auth/signup', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ merchantName, phone, email, bankName, settlementAccount, password })
        });
        const data = await res.json();

        if (data.status === 'success') {
            localStorage.setItem('merchantSession', JSON.stringify(data.merchant));
            showAlert('🎉 Onboarding successful! Redirecting to dashboard...', 'success');
            setTimeout(() => { window.location.href = '/dashboard'; }, 1000);
        } else {
            showAlert(data.message || 'Onboarding failed.', 'error');
        }
    } catch (err) {
        showAlert('Network connection error. Please try again.', 'error');
    }
});
</script>

</body>
</html>
