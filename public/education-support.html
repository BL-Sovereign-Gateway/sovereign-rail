<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Education Support Fund | @BL SOVEREIGN GATEWAY</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { background: #1e293b; border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 30px; width: 100%; max-width: 550px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); }
        .header { text-align: center; margin-bottom: 24px; }
        .header h2 { font-size: 1.6rem; color: #0ea5e9; letter-spacing: 0.5px; }
        .header p { font-size: 0.9rem; color: #94a3b8; margin-top: 4px; }
        .banner { background: rgba(14, 165, 233, 0.15); border: 1px solid #0ea5e9; color: #38bdf8; font-size: 0.85rem; padding: 12px; border-radius: 8px; text-align: center; margin-bottom: 20px; font-weight: 600; line-height: 1.4; }
        
        .bank-details-card { background: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 16px; margin-bottom: 20px; }
        .bank-details-card h3 { font-size: 0.85rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; border-bottom: 1px solid #1e293b; padding-bottom: 6px; }
        .bank-row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 0.9rem; }
        .bank-row .label { color: #94a3b8; }
        .bank-row .value { color: #fff; font-weight: 600; }
        .bank-row .highlight { color: #38bdf8; font-size: 1.1rem; font-weight: 700; letter-spacing: 1px; }

        .form-group { margin-bottom: 16px; }
        .form-row { display: flex; gap: 12px; }
        .form-row .form-group { flex: 1; }
        label { display: block; font-size: 0.85rem; color: #cbd5e1; margin-bottom: 6px; font-weight: 500; }
        input, select { width: 100%; padding: 12px; border-radius: 8px; background: #0f172a; border: 1px solid #334155; color: #fff; font-size: 0.95rem; outline: none; transition: border-color 0.2s; }
        input[readonly] { background: #1b2537; color: #94a3b8; cursor: not-allowed; border-color: #1e293b; }
        input:focus, select:focus { border-color: #0ea5e9; }
        select option { background: #1e293b; color: #fff; }
        button { width: 100%; padding: 14px; background: #0ea5e9; color: #fff; border: none; border-radius: 8px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
        button:hover { background: #38bdf8; }
        #message { margin-top: 16px; font-size: 0.9rem; text-align: center; border-radius: 8px; padding: 12px; display: none; }
        .success { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid #10b981; }
        .error { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }
        .virtual-account-box { background: #0f172a; border: 1px dashed #0ea5e9; border-radius: 8px; padding: 16px; margin-top: 16px; text-align: left; }
        .virtual-account-box p { font-size: 0.9rem; color: #cbd5e1; margin-bottom: 6px; }
        .virtual-account-box span { font-weight: 700; color: #38bdf8; }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <h2>EDUCATION SUPPORT FUND</h2>
        <p>Voluntary Contributions & School Growth Grants</p>
    </div>

    <div class="banner">
        🤝 FREE-WILL DONATIONS FOR SCHOOL INFRASTRUCTURE, EQUIPMENT & GROWTH
    </div>

    <div class="bank-details-card">
        <h3>Primary Settlement Details</h3>
        <div class="bank-row">
            <span class="label">Beneficiary:</span>
            <span class="value">Real Schools, Eyita</span>
        </div>
        <div class="bank-row">
            <span class="label">Account Name:</span>
            <span class="value">All Time Business Ltd</span>
        </div>
        <div class="bank-row">
            <span class="label">Bank Name:</span>
            <span class="value">Access Bank Plc</span>
        </div>
        <div class="bank-row">
            <span class="label">Account Number:</span>
            <span class="value highlight">0037323182</span>
        </div>
    </div>

    <form id="eduForm">
        <div class="form-group">
            <label for="institutionName">Beneficiary School *</label>
            <input type="text" id="institutionName" value="Real Schools, Eyita" readonly required>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="donorName">Donor / Supporter Name *</label>
                <input type="text" id="donorName" placeholder="e.g. Parent, Alumnus, or Sponsor" required>
            </div>
            <div class="form-group">
                <label for="donationPurpose">Support Purpose *</label>
                <select id="donationPurpose" required>
                    <option value="" disabled selected>Select Purpose</option>
                    <option value="GENERAL_GROWTH">General School Growth Fund</option>
                    <option value="INFRASTRUCTURE">Building & Facility Improvement</option>
                    <option value="LAB_TECH">ICT & Science Lab Equipment</option>
                    <option value="SCHOLARSHIP">Student Sponsorship / Grant</option>
                    <option value="SPORTS_ARTS">Sports & Cultural Development</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label for="targetAmount">Voluntary Contribution Amount (₦) *</label>
            <input type="number" id="targetAmount" min="1000" step="500" placeholder="e.g. 25000" required>
        </div>

        <button type="submit" id="submitBtn">Generate Dynamic Payment Virtual NUBAN</button>
    </form>

    <div id="message"></div>
</div>

<script>
    const form = document.getElementById('eduForm');
    const msgDiv = document.getElementById('message');
    const btn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        btn.disabled = true;
        btn.innerText = 'Generating NUBAN...';
        msgDiv.style.display = 'none';

        const institutionName = document.getElementById('institutionName').value;
        const donorName = document.getElementById('donorName').value;
        const targetAmount = document.getElementById('targetAmount').value;
        const accountRef = 'DONATION-' + Date.now();

        const payload = {
            schoolName: `${institutionName} - ${donorName}`,
            targetAmount: targetAmount,
            accountRef: accountRef
        };

        try {
            const res = await fetch('/api/v1/create-virtual-account', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await res.json();

            if (res.ok && data.status === 'success') {
                const details = data.account_details;
                msgDiv.className = 'success';
                msgDiv.innerHTML = `
                    <div class="virtual-account-box">
                        <p><strong>Pay To Bank:</strong> <span>${details.bankName}</span></p>
                        <p><strong>Dynamic Virtual Account:</strong> <span style="font-size:1.2rem; color:#34d399;">${details.accountNumber}</span></p>
                        <p><strong>Account Name:</strong> <span>${details.accountName}</span></p>
                        <p><strong>Total Transfer Amount:</strong> <span>${details.customerMustTransfer}</span></p>
                        <hr style="border:0; border-top:1px solid #334155; margin:10px 0;">
                        <p style="font-size:0.8rem; color:#94a3b8; text-align:center;">Transfer your free-will donation to the Virtual NUBAN above or directly to Access Bank 0037323182. Thank you for supporting school growth!</p>
                    </div>
                `;
                msgDiv.style.display = 'block';
                btn.disabled = false;
                btn.innerText = 'Generate New Donation Account';
            } else {
                throw new Error(data.message || 'Failed to generate Virtual Account.');
            }
        } catch (err) {
            msgDiv.className = 'error';
            msgDiv.innerText = '❌ ' + err.message;
            msgDiv.style.display = 'block';
            btn.disabled = false;
            btn.innerText = 'Generate Dynamic Payment Virtual NUBAN';
        }
    });
</script>

</body>
</html>
