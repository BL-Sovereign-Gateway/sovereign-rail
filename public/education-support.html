<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Education Support Fund | @BL SOVEREIGN GATEWAY</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { background: #1e293b; border: 1px solid #38bdf8; border-radius: 16px; padding: 30px; width: 100%; max-width: 480px; box-shadow: 0 20px 25px rgba(0,0,0,0.5); }
        .brand-header { text-align: center; margin-bottom: 20px; }
        .brand-header h2 { font-size: 1.3rem; font-weight: 800; color: #38bdf8; margin: 0; }
        .brand-header p { font-size: 0.75rem; color: #94a3b8; letter-spacing: 1px; margin-top: 2px; text-transform: uppercase; }
        
        .tab-group { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; text-align: center; cursor: pointer; font-size: 0.85rem; font-weight: 700; color: #cbd5e1; }
        .tab-btn.active { border-color: #38bdf8; color: #38bdf8; background: rgba(56, 189, 248, 0.1); }
        
        .form-group { margin-bottom: 14px; }
        label { display: block; font-size: 0.85rem; color: #cbd5e1; margin-bottom: 6px; }
        input, select { width: 100%; padding: 12px; border-radius: 8px; background: #0f172a; border: 1px solid #334155; color: #fff; font-size: 0.9rem; outline: none; }
        input:focus, select:focus { border-color: #38bdf8; }
        
        .payment-options { display: flex; gap: 10px; margin: 15px 0; }
        .pay-option { flex: 1; padding: 10px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; text-align: center; cursor: pointer; font-size: 0.8rem; font-weight: 600; color: #cbd5e1; }
        .pay-option.active { border-color: #38bdf8; color: #38bdf8; background: rgba(56, 189, 248, 0.1); }
        
        .btn-submit { width: 100%; padding: 14px; background: #10b981; color: #fff; border: none; border-radius: 8px; font-weight: 800; cursor: pointer; font-size: 1rem; margin-top: 10px; }
        .btn-submit:hover { background: #059669; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; z-index: 1000; }
        .modal-box { background: #1e293b; border: 1px solid #38bdf8; border-radius: 16px; padding: 24px; width: 90%; max-width: 420px; text-align: center; }
        .modal-btn { background: #0ea5e9; color: #fff; border: none; padding: 10px 24px; border-radius: 8px; font-weight: 700; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

<div class="card">
    <div class="brand-header">
        <h2>🎓 EDUCATION SUPPORT FUND</h2>
        <p>ALL TIME BUSINESS LTD | @BL SOVEREIGN GATEWAY</p>
    </div>

    <!-- Toggle between Purchase and Support -->
    <div class="tab-group">
        <div class="tab-btn active" onclick="switchAction('BUY', this)">🎟 Buy e-PINs</div>
        <div class="tab-btn" onclick="switchAction('DONATE', this)">🎁 Support a Student</div>
    </div>

    <form id="eduForm">
        <div class="form-group">
            <label id="serviceLabel">Select Examination Body *</label>
            <select id="examSelect" required>
                <option value="waec">WAEC Result Checker e-PIN</option>
                <option value="jamb">JAMB Registration / UTME e-PIN</option>
            </select>
        </div>

        <div class="form-group" id="targetGroup">
            <label id="inputLabel">Beneficiary Phone Number / Email *</label>
            <input type="text" id="targetInput" placeholder="e.g. 08012345678" required>
        </div>

        <div class="form-group">
            <label>Amount (₦) *</label>
            <input type="number" id="amount" placeholder="3500" min="500" required>
        </div>

        <label>Payment Method</label>
        <div class="payment-options">
            <div class="pay-option active" onclick="setPayMethod('TRANSFER', this)">🏦 Bank Transfer</div>
            <div class="pay-option" onclick="setPayMethod('CARD', this)">💳 Card / USSD</div>
            <div class="pay-option" onclick="setPayMethod('WALLET', this)">💼 Gateway Wallet</div>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">Proceed to Buy e-PIN</button>
    </form>
</div>

<!-- Modal Popup -->
<div class="modal-overlay" id="customModal">
    <div class="modal-box">
        <h3 style="color:#38bdf8; margin-bottom:12px;">@BL SOVEREIGN GATEWAY</h3>
        <div id="modalBody" style="font-size:0.9rem; color:#cbd5e1; line-height:1.5; margin-bottom:15px;"></div>
        <button class="modal-btn" onclick="closeModal()">Close</button>
    </div>
</div>

<script>
let activeAction = 'BUY';
let selectedPayMethod = 'TRANSFER';

function switchAction(action, el) {
    activeAction = action;
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    el.classList.add('active');

    const submitBtn = document.getElementById('submitBtn');
    const inputLabel = document.getElementById('inputLabel');
    const targetInput = document.getElementById('targetInput');

    if (action === 'BUY') {
        submitBtn.textContent = 'Proceed to Buy e-PIN';
        inputLabel.textContent = 'Beneficiary Phone Number / Email *';
        targetInput.placeholder = 'e.g. 08012345678';
    } else {
        submitBtn.textContent = 'Donate to Education Support Fund';
        inputLabel.textContent = 'Donor Name / Sponsoring Organization *';
        targetInput.placeholder = 'e.g. Sovereign Gateway Foundation';
    }
}

function setPayMethod(method, el) {
    selectedPayMethod = method;
    document.querySelectorAll('.pay-option').forEach(opt => opt.classList.remove('active'));
    el.classList.add('active');
}

function closeModal() {
    document.getElementById('customModal').style.display = 'none';
}

document.getElementById('eduForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Processing...';

    const merchant = JSON.parse(localStorage.getItem('merchantSession') || '{}');
    const modalBody = document.getElementById('modalBody');

    const examType = document.getElementById('examSelect').value;
    const targetInput = document.getElementById('targetInput').value;
    const amount = parseFloat(document.getElementById('amount').value);

    const serviceCode = activeAction === 'BUY' ? examType : `DONATION_${examType.toUpperCase()}`;

    try {
        if (selectedPayMethod === 'WALLET') {
            if (!merchant.phone) {
                modalBody.innerText = "❌ Please sign in to your merchant dashboard to pay via wallet balance.";
                document.getElementById('customModal').style.display = 'flex';
                btn.disabled = false;
                btn.textContent = activeAction === 'BUY' ? 'Proceed to Buy e-PIN' : 'Donate to Education Support Fund';
                return;
            }

            const res = await fetch('/api/v1/checkout/wallet', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    merchantPhone: merchant.phone,
                    serviceType: serviceCode,
                    targetInput: targetInput,
                    amount: amount
                })
            });
            const data = await res.json();
            modalBody.innerText = data.message;
            document.getElementById('customModal').style.display = 'flex';
        } else {
            const res = await fetch('/api/v1/checkout/initialize', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    serviceType: serviceCode,
                    targetInput: targetInput,
                    amount: amount,
                    paymentMethod: selectedPayMethod
                })
            });
            const data = await res.json();

            if (data.status === 'success') {
                if (data.paymentMethod === 'TRANSFER') {
                    modalBody.innerHTML = `
                        <p>Transfer <strong>${data.bankDetails.amountToPay}</strong> to complete your request:</p>
                        <div style="background:#0f172a; padding:14px; border-radius:8px; margin:15px 0; border:1px dashed #38bdf8;">
                            <p style="margin-bottom:4px;"><strong>Bank:</strong> ${data.bankDetails.bankName}</p>
                            <p style="font-size:1.3rem; font-weight:800; color:#38bdf8; margin:6px 0;">${data.bankDetails.accountNumber}</p>
                        </div>
                        <small style="color:#10b981; font-weight:700;">⚡ e-PIN / Contribution processed automatically upon credit!</small>
                    `;
                } else {
                    modalBody.innerHTML = `
                        <p>Click below to complete payment via Card or USSD:</p>
                        <a href="${data.checkoutUrl}" target="_blank" style="display:inline-block; margin-top:15px; padding:12px 24px; background:#10b981; color:#fff; border-radius:8px; text-decoration:none; font-weight:800;">Open Payment Gateway</a>
                    `;
                }
                document.getElementById('customModal').style.display = 'flex';
            }
        }
    } catch (err) {
        modalBody.innerText = "❌ Network connection error. Please try again.";
        document.getElementById('customModal').style.display = 'flex';
    }

    btn.disabled = false;
    btn.textContent = activeAction === 'BUY' ? 'Proceed to Buy e-PIN' : 'Donate to Education Support Fund';
});
</script>

</body>
</html>
