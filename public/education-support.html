<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Education Support | @BL SOVEREIGN GATEWAY</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: #0f172a; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { background: #1e293b; border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 30px; width: 100%; max-width: 550px; }
        .header { text-align: center; margin-bottom: 24px; }
        .header h2 { color: #0ea5e9; }
        .banner { background: rgba(14, 165, 233, 0.15); border: 1px solid #0ea5e9; color: #38bdf8; font-size: 0.85rem; padding: 12px; border-radius: 8px; text-align: center; margin-bottom: 20px; font-weight: 600; }
        .form-group { margin-bottom: 16px; }
        .form-row { display: flex; gap: 12px; }
        .form-row .form-group { flex: 1; }
        label { display: block; font-size: 0.85rem; color: #cbd5e1; margin-bottom: 6px; }
        input, select { width: 100%; padding: 12px; border-radius: 8px; background: #0f172a; border: 1px solid #334155; color: #fff; font-size: 0.95rem; outline: none; }
        button { width: 100%; padding: 14px; background: #0ea5e9; color: #fff; border: none; border-radius: 8px; font-weight: 700; font-size: 1rem; cursor: pointer; margin-top: 10px; }
        #message { margin-top: 16px; font-size: 0.9rem; text-align: center; border-radius: 8px; padding: 12px; display: none; }
        .success { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid #10b981; }
        .error { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }
        .virtual-account-box { background: #0f172a; border: 1px dashed #0ea5e9; border-radius: 8px; padding: 16px; margin-top: 16px; text-align: left; }
        .virtual-account-box p { font-size: 0.9rem; color: #cbd5e1; margin-bottom: 6px; }
        .virtual-account-box span { font-weight: 700; color: #38bdf8; }
    </style>
</head>
<body>
<div class="card">
    <div class="header">
        <h2>EDUCATION FEE SUPPORT</h2>
        <p>Automated Tuition & School Fee Collection Engine</p>
    </div>
    <div class="banner">🎓 SEAMLESS PARENT TRANSFERS VIA DYNAMIC VIRTUAL ACCOUNTS + ₦2.00 CASHBACK REWARD</div>
    <form id="eduForm">
        <div class="form-group">
            <label for="institutionName">School / Institution Name *</label>
            <input type="text" id="institutionName" placeholder="e.g. Real Schools, Eyita" required>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="studentName">Student Name / Reg No. *</label>
                <input type="text" id="studentName" placeholder="e.g. John Doe (REG/2026/04)" required>
            </div>
            <div class="form-group">
                <label for="feeType">Fee Category *</label>
                <select id="feeType" required>
                    <option value="" disabled selected>Select Fee Type</option>
                    <option value="TUITION">Tuition / School Fees</option>
                    <option value="DEVELOPMENT">Development Levy</option>
                    <option value="EXAMINATION">Exam / WAEC / NECO Fee</option>
                    <option value="UNIFORM_BOOKS">Uniforms & Books</option>
                    <option value="TRANSPORT">Bus / Transport Fee</option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label for="targetAmount">Tuition / Fee Amount (₦) *</label>
            <input type="number" id="targetAmount" min="1000" step="500" placeholder="e.g. 45000" required>
        </div>
        <button type="submit" id="submitBtn">Generate Payment Virtual Account</button>
    </form>
    <div id="message"></div>
</div>
<script>
    const form = document.getElementById('eduForm');
    const msgDiv = document.getElementById('message');
    const btn = document.getElementById('submitBtn');
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        btn.disabled = true;
        btn.innerText = 'Generating Virtual NUBAN...';
        msgDiv.style.display = 'none';
        const institutionName = document.getElementById('institutionName').value;
        const studentName = document.getElementById('studentName').value;
        const targetAmount = document.getElementById('targetAmount').value;
        const accountRef = 'EDU-' + Date.now();
        const payload = { schoolName: `${institutionName} - ${studentName}`, targetAmount: targetAmount, accountRef: accountRef };
        try {
            const res = await fetch('/api/v1/create-virtual-account', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if (res.ok && data.status === 'success') {
                const details = data.account_details;
                msgDiv.className = 'success';
                msgDiv.innerHTML = `
                    <div class="virtual-account-box">
                        <p><strong>Bank Name:</strong> <span>${details.bankName}</span></p>
                        <p><strong>Account Number:</strong> <span style="font-size:1.2rem; color:#34d399;">${details.accountNumber}</span></p>
                        <p><strong>Account Name:</strong> <span>${details.accountName}</span></p>
                        <p><strong>Total Amount to Transfer:</strong> <span>${details.customerMustTransfer}</span></p>
                    </div>`;
                msgDiv.style.display = 'block';
                btn.disabled = false;
                btn.innerText = 'Generate New Account';
            } else {
                throw new Error(data.message || 'Failed to generate Virtual Account.');
            }
        } catch (err) {
            msgDiv.className = 'error';
            msgDiv.innerText = '❌ ' + err.message;
            msgDiv.style.display = 'block';
            btn.disabled = false;
            btn.innerText = 'Generate Payment Virtual Account';
        }
    });
</script>
</body>
</html>
