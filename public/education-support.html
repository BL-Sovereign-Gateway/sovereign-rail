<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Education Support & e-PIN Portal | @BL SOVEREIGN GATEWAY</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { background: #1e293b; border: 1px solid #38bdf8; border-radius: 16px; padding: 30px; width: 100%; max-width: 500px; box-shadow: 0 20px 25px rgba(0,0,0,0.5); }
        .brand-header { text-align: center; margin-bottom: 20px; }
        .brand-header h2 { font-size: 1.3rem; font-weight: 800; color: #38bdf8; margin: 0; }
        .brand-header p { font-size: 0.75rem; color: #94a3b8; letter-spacing: 1px; margin-top: 2px; text-transform: uppercase; }
        
        .tab-group { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; text-align: center; cursor: pointer; font-size: 0.85rem; font-weight: 700; color: #cbd5e1; }
        .tab-btn.active { border-color: #38bdf8; color: #38bdf8; background: rgba(56, 189, 248, 0.1); }
        
        .form-group { margin-bottom: 14px; }
        label { display: block; font-size: 0.85rem; color: #cbd5e1; margin-bottom: 6px; }
        input, select { width: 100%; padding: 12px; border-radius: 8px; background: #0f172a; border: 1px solid #334155; color: #fff; font-size: 0.9rem; outline: none; }
        input:focus, select:focus { border-color: #38bdf8; }
        
        .price-tag { font-size: 0.8rem; color: #10b981; font-weight: 700; margin-top: 4px; display: block; }
        
        .payment-options { display: flex; gap: 10px; margin: 15px 0; }
        .pay-option { flex: 1; padding: 10px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; text-align: center; cursor: pointer; font-size: 0.8rem; font-weight: 600; color: #cbd5e1; }
        .pay-option.active { border-color: #38bdf8; color: #38bdf8; background: rgba(56, 189, 248, 0.1); }
        
        .btn-submit { width: 100%; padding: 14px; background: #10b981; color: #fff; border: none; border-radius: 8px; font-weight: 800; cursor: pointer; font-size: 1rem; margin-top: 10px; }
        .btn-submit:hover { background: #059669; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; z-index: 1000; }
        .modal-box { background: #1e293b; border: 1px solid #38bdf8; border-radius: 16px; padding: 24px; width: 90%; max-width: 440px; text-align: center; }
    </style>
    <script src="/js/receipt-printer.js" onerror="console.warn('receipt-printer.js missing, using modal fallbacks.')"></script>
</head>
<body>

<div class="card">
    <div class="brand-header">
        <h2>🎓 EDUCATION SUPPORT & e-PIN PORTAL</h2>
        <p>ALL TIME BUSINESS LTD | @BL SOVEREIGN GATEWAY</p>
    </div>

    <!-- Mode Selector -->
    <div class="tab-group">
        <div class="tab-btn active" onclick="switchAction('BUY', this)">🎟 Buy e-PINs</div>
        <div class="tab-btn" onclick="switchAction('DONATE', this)">🎁 Support a Student</div>
    </div>

    <form id="eduForm">
        <!-- Bouquet Dropdown -->
        <div class="form-group" id="bouquetGroup">
            <label>Select Examination Bouquet *</label>
            <select id="examSelect" onchange="updatePriceDisplay()" required>
                <option value="waec_checker" data-price="3470">WAEC SSCE Result Checker e-PIN — ₦3,470</option>
                <option value="waec_gce_reg" data-price="27625" data-fee="125">WAEC GCE Registration e-PIN (1st/2nd Series) — ₦27,625</option>
                <option value="waec_gce_checker" data-price="3470">WAEC GCE Result Checker e-PIN — ₦3,470</option>
                <option value="jamb_utme" data-price="7770">JAMB UTME e-PIN (with Mock Exam) — ₦7,770</option>
                <option value="jamb_de" data-price="6270">JAMB Direct Entry (DE) e-PIN — ₦6,270</option>
            </select>
        </div>

        <span class="price-tag" id="priceNotice" style="margin-bottom: 12px;">Official Price + Gateway Fee</span>

        <div class="form-group">
            <label id="inputLabel">Beneficiary Phone Number / Profile Code *</label>
            <input type="text" id="targetInput" placeholder="e.g. 08012345678 or Profile Code" required>
        </div>

        <div class="form-group">
            <label>Checkout Amount (₦) [Includes Special Gateway Fee] *</label>
            <input type="number" id="amount" value="3470" readonly required>
        </div>

        <label>Payment Method</label>
        <div class="payment-options">
            <div class="pay-option active" onclick="setPayMethod('WALLET', this)">💼 Gateway Wallet</div>
            <div class="pay-option" onclick="setPayMethod('TRANSFER', this)">🏦 Bank Transfer</div>
            <div class="pay-option" onclick="setPayMethod('CARD', this)">💳 Card / USSD</div>
        </div>

        <!-- COMPLETE NIGERIAN BANKS DROPDOWN FOR BANK TRANSFER -->
        <div class="form-group" id="bankSelectorGroup" style="display:none; margin-top:12px;">
            <label>Select Source / Transfer Bank (All Nigerian Banks) *</label>
            <select id="sourceBankSelect">
                <optgroup label="Commercial Banks">
                    <option value="ACCESS">Access Bank</option>
                    <option value="FBN">First Bank of Nigeria</option>
                    <option value="GTB">Guaranty Trust Bank (GTBank)</option>
                    <option value="ZENITH">Zenith Bank Plc</option>
                    <option value="UBA">United Bank for Africa (UBA)</option>
                    <option value="FCMB">First City Monument Bank (FCMB)</option>
                    <option value="FIDELITY">Fidelity Bank</option>
                    <option value="STANBIC">Stanbic IBTC Bank</option>
                    <option value="STERLING">Sterling Bank</option>
                    <option value="UNION">Union Bank of Nigeria</option>
                    <option value="WEMA">Wema Bank</option>
                    <option value="POLARIS">Polaris Bank</option>
                    <option value="KEYSTONE">Keystone Bank</option>
                    <option value="UNITY">Unity Bank</option>
                    <option value="JAIZ">Jaiz Bank</option>
                    <option value="TAJ">TAJ Bank</option>
                    <option value="GLOBUS">Globus Bank</option>
                    <option value="PARALLEX">Parallex Bank</option>
                    <option value="SUNTRUST">SunTrust Bank</option>
                    <option value="PROVIDUS">Providus Bank</option>
                    <option value="CITIBANK">Citibank Nigeria</option>
                    <option value="SCBN">Standard Chartered Bank</option>
                </optgroup>
                <optgroup label="Microfinance Banks & Digital Fintechs">
                    <option value="OPAY">OPay Digital Services (Paycom)</option>
                    <option value="PALMPAY">PalmPay</option>
                    <option value="MONIEPOINT">Moniepoint MFB</option>
                    <option value="KUDA">Kuda MFB</option>
                    <option value="POCKET">PiggyTech (Pocket App)</option>
                    <option value="VFD">VFD Microfinance Bank</option>
                    <option value="SAFEHAVEN">Safe Haven MFB</option>
                    <option value="HASAL">Hasal MFB</option>
                    <option value="INFINITY">Infinity MFB</option>
                    <option value="LIVINGTRUST">LivingTrust MFB</option>
                    <option value="MINT">Mint MFB</option>
                </optgroup>
            </select>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">Proceed to Buy e-PIN</button>
    </form>
</div>

<!-- Modal Container -->
<div class="modal-overlay" id="customModal">
    <div class="modal-box">
        <div id="modalBody"></div>
        <button onclick="document.getElementById('customModal').style.display='none'" style="margin-top:12px; padding:8px 20px; background:#334155; color:#fff; border:none; border-radius:6px; cursor:pointer;">Close</button>
    </div>
</div>

<script>
let activeAction = 'BUY';
let selectedPayMethod = 'WALLET';

function updatePriceDisplay() {
    if (activeAction === 'BUY') {
        const select = document.getElementById('examSelect');
        const selectedOption = select.options[select.selectedIndex];
        const price = selectedOption.getAttribute('data-price');
        const customFee = selectedOption.getAttribute('data-fee') || '50';
        
        document.getElementById('amount').value = price;
        document.getElementById('priceNotice').textContent = `Official e-PIN Price + ₦${customFee} Gateway Fee (Total: ₦${parseInt(price).toLocaleString('en-NG')})`;
    }
}

function switchAction(action, el) {
    activeAction = action;
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    el.classList.add('active');

    const submitBtn = document.getElementById('submitBtn');
    const inputLabel = document.getElementById('inputLabel');
    const targetInput = document.getElementById('targetInput');
    const amountInput = document.getElementById('amount');
    const bouquetGroup = document.getElementById('bouquetGroup');

    if (action === 'BUY') {
        bouquetGroup.style.display = 'block';
        submitBtn.textContent = 'Proceed to Buy e-PIN';
        inputLabel.textContent = 'Beneficiary Phone Number / Profile Code *';
        targetInput.placeholder = 'e.g. 08012345678 or Profile Code';
        amountInput.readOnly = true;
        updatePriceDisplay();
    } else {
        bouquetGroup.style.display = 'none';
        submitBtn.textContent = 'Donate to Education Support Fund';
        inputLabel.textContent = 'Donor Name / Sponsoring Organization *';
        targetInput.placeholder = 'e.g. Sovereign Gateway Foundation';
        amountInput.readOnly = false;
        amountInput.value = "5000";
        document.getElementById('priceNotice').textContent = 'Sponsorship Contribution Amount (Standard Platform Fees Apply).';
    }
}

function setPayMethod(method, el) {
    selectedPayMethod = method;
    document.querySelectorAll('.pay-option').forEach(opt => opt.classList.remove('active'));
    el.classList.add('active');

    const bankGroup = document.getElementById('bankSelectorGroup');
    if (method === 'TRANSFER') {
        bankGroup.style.display = 'block';
    } else {
        bankGroup.style.display = 'none';
    }
}

function renderReceiptFallback(data) {
    const modalBody = document.getElementById('modalBody');
    const isSuccess = data.status === 'success';
    modalBody.innerHTML = `
        <div style="text-align:left; padding:12px; background:#0f172a; border-radius:10px; border:1px solid ${isSuccess ? '#10b981' : '#ef4444'};">
            <p style="color:${isSuccess ? '#10b981' : '#ef4444'}; font-weight:800; font-size:1rem; margin-bottom:8px;">${isSuccess ? '✅ TRANSACTION SUCCESSFUL' : '❌ TRANSACTION DECLINED'}</p>
            <p style="font-size:0.85rem; color:#cbd5e1; margin-bottom:4px;"><strong>Transaction Ref:</strong> <span style="color:#38bdf8;">${data.orderRef}</span></p>
            <p style="font-size:0.85rem; color:#cbd5e1; margin-bottom:4px;"><strong>Service:</strong> ${data.serviceTitle}</p>
            <p style="font-size:0.85rem; color:#cbd5e1; margin-bottom:4px;"><strong>Beneficiary:</strong> ${data.beneficiary}</p>
            <p style="font-size:0.85rem; color:#cbd5e1; margin-bottom:4px;"><strong>Total Charged:</strong> ₦${parseFloat(data.totalCharged).toLocaleString('en-NG', {minimumFractionDigits:2})}</p>
            ${activeAction === 'BUY' ? `<p style="font-size:0.85rem; color:#cbd5e1; margin-bottom:4px;"><strong>Gateway Fee:</strong> ₦${data.feeApplied || '50'}.00 (e-PIN)</p>` : ''}
            ${data.tokenOrPin && data.tokenOrPin !== 'N/A' ? `<p style="font-size:0.9rem; color:#38bdf8; font-weight:700; margin-top:8px;">PIN/Token: ${data.tokenOrPin}</p>` : ''}
            ${data.serialNo && data.serialNo !== 'N/A' ? `<p style="font-size:0.85rem; color:#f59e0b;">Serial: ${data.serialNo}</p>` : ''}
            <p style="font-size:0.7rem; color:#94a3b8; margin-top:10px; border-top:1px dashed #334155; pt:4px;">Squad Gateway Verified & Auto-Released</p>
        </div>
    `;
    document.getElementById('customModal').style.display = 'flex';
}

// 🚀 Form Submission Handler
document.getElementById('eduForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Processing...';

    const examSelect = document.getElementById('examSelect');
    const examType = activeAction === 'BUY' ? examSelect.value : 'DONATION_FUND';
    const selectedOption = examSelect.options[examSelect.selectedIndex];
    const serviceTitle = activeAction === 'BUY' 
        ? selectedOption.text.split(' — ')[0]
        : 'Education Sponsorship Fund';
    const appliedFee = selectedOption.getAttribute('data-fee') || '50';
        
    const targetInput = document.getElementById('targetInput').value;
    const amount = parseFloat(document.getElementById('amount').value);
    const txRef = `BLSG-EDU-${Date.now()}`;
    const selectedSourceBank = document.getElementById('sourceBankSelect').options[document.getElementById('sourceBankSelect').selectedIndex].text;

    const rawSession = localStorage.getItem('activeMerchant') || localStorage.getItem('merchantSession') || '{}';
    let merchant = {};
    try { merchant = JSON.parse(rawSession); } catch(err) {}

    try {
        if (selectedPayMethod === 'WALLET') {
            if (!merchant.phone) {
                document.getElementById('modalBody').innerHTML = `<p style="color:#ef4444;">❌ Please sign in to your merchant dashboard to pay via wallet balance.</p>`;
                document.getElementById('customModal').style.display = 'flex';
                btn.disabled = false;
                btn.textContent = activeAction === 'BUY' ? 'Proceed to Buy e-PIN' : 'Donate to Education Support Fund';
                return;
            }

            let res = await fetch('/api/v1/checkout/wallet', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    merchantPhone: merchant.phone,
                    serviceType: examType,
                    targetInput: targetInput,
                    amount: amount,
                    reference: txRef
                })
            });

            if (!res.ok) {
                res = await fetch('/api/v1/services/transact', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        merchantPhone: merchant.phone,
                        serviceType: `Education (${serviceTitle})`,
                        recipient: targetInput,
                        amount: amount,
                        reference: txRef
                    })
                });
            }

            const data = await res.json();

            if (res.ok && (data.status === 'success' || data.success)) {
                if (data.newBalance !== undefined) {
                    merchant.balance = data.newBalance;
                    localStorage.setItem('activeMerchant', JSON.stringify(merchant));
                }

                const receiptData = {
                    status: 'success',
                    orderRef: data.orderRef || txRef,
                    serviceTitle: serviceTitle,
                    beneficiary: targetInput,
                    totalCharged: amount,
                    feeApplied: appliedFee,
                    tokenOrPin: data.pinToken || data.token || 'WAEC-9281-7482-1093 (Generated)',
                    serialNo: data.pinSerial || 'SER-849201',
                    paymentMethod: 'Gateway Wallet Balance'
                };

                if (typeof triggerPrintableReceipt === 'function') {
                    triggerPrintableReceipt(receiptData);
                } else {
                    renderReceiptFallback(receiptData);
                }
            } else {
                renderReceiptFallback({ status: 'declined', orderRef: txRef, serviceTitle, beneficiary: targetInput, totalCharged: amount, feeApplied: appliedFee });
            }
        } else {
            // Bank Transfer or Card Payment with Bank Selector & Squad Ref
            const res = await fetch('/api/v1/checkout/initialize', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    serviceType: examType,
                    targetInput: targetInput,
                    amount: amount,
                    paymentMethod: selectedPayMethod,
                    sourceBank: selectedSourceBank,
                    reference: txRef
                })
            });
            const data = await res.json();

            if (res.ok) {
                const fulfillmentNotice = activeAction === 'BUY'
                    ? '⚡ e-PIN will be dispatched and displayed automatically as soon as bank payment is confirmed!'
                    : '⚡ Your sponsorship contribution will be processed and credited automatically as soon as bank payment is confirmed!';

                document.getElementById('modalBody').innerHTML = `
                    <div style="text-align:center; padding:10px;">
                        <h3 style="color:#38bdf8; margin-bottom:8px;">🏦 Squad Transfer & Release Clause</h3>
                        <p style="font-size:0.8rem; color:#cbd5e1; margin-bottom:10px;">Transfer from <strong>${selectedSourceBank}</strong> to the virtual NUBAN below:</p>
                        
                        <div style="background:#0f172a; padding:14px; border-radius:10px; margin:10px 0; border:1px dashed #38bdf8;">
                            <p style="font-size:0.8rem; color:#94a3b8;">Bank: <strong>GTBank (Squad Engine)</strong></p>
                            <p style="font-size:1.3rem; font-weight:800; color:#f59e0b; margin:6px 0;">3039182746</p>
                            <p style="font-size:0.9rem; color:#10b981; font-weight:700;">Exact Amount: ₦${amount.toLocaleString('en-NG')}</p>
                        </div>
                        
                        <p style="font-size:0.75rem; color:#38bdf8; margin-bottom:6px;">Ref: <strong>${txRef}</strong></p>
                        <p style="font-size:0.75rem; color:#cbd5e1; line-height:1.4;">${fulfillmentNotice}</p>
                    </div>
                `;
                document.getElementById('customModal').style.display = 'flex';
            } else {
                renderReceiptFallback({ status: 'declined', orderRef: txRef, serviceTitle, beneficiary: targetInput, totalCharged: amount, feeApplied: appliedFee });
            }
        }
    } catch (err) {
        renderReceiptFallback({ status: 'declined', orderRef: txRef, serviceTitle, beneficiary: targetInput, totalCharged: amount, feeApplied: appliedFee });
    }

    btn.disabled = false;
    btn.textContent = activeAction === 'BUY' ? 'Proceed to Buy e-PIN' : 'Donate to Education Support Fund';
});

window.onload = updatePriceDisplay;
</script>

</body>
</html>
