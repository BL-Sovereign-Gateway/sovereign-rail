<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bill Payments | @BL SOVEREIGN GATEWAY</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { background: #1e293b; border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 30px; width: 100%; max-width: 500px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); }
        .header { text-align: center; margin-bottom: 20px; }
        .header h2 { color: #f59e0b; font-size: 1.5rem; margin-bottom: 6px; }
        .header p { color: #94a3b8; font-size: 0.85rem; }
        
        .promo-banner { background: rgba(245, 158, 11, 0.15); border: 1px solid #f59e0b; border-radius: 8px; padding: 10px; text-align: center; color: #f59e0b; font-weight: 700; font-size: 0.8rem; margin-bottom: 20px; }
        
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 0.85rem; color: #cbd5e1; margin-bottom: 6px; }
        input, select { width: 100%; padding: 12px; border-radius: 8px; background: #0f172a; border: 1px solid #334155; color: #fff; font-size: 0.95rem; outline: none; }
        input:focus, select:focus { border-color: #f59e0b; }
        button.btn { width: 100%; padding: 14px; background: #f59e0b; color: #000; border: none; border-radius: 8px; font-weight: 700; font-size: 1rem; cursor: pointer; margin-top: 10px; }
        button.btn:hover { background: #d97706; }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <h2>⚡ INSTANT BILL PAYMENTS</h2>
        <p>Electricity Bills, Cable TV Subscriptions & Government Levies</p>
    </div>

    <div class="promo-banner">
        CONSOLIDATED UTILITY & BILL SETTLEMENTS AT SCALE
    </div>

    <form id="billForm">
        <div class="form-group">
            <label>Select Biller / Service *</label>
            <select id="providerSelect" required>
                <option value="" disabled selected>Loading Biller Services...</option>
            </select>
        </div>

        <div class="form-group">
            <label>Meter Number / Smartcard ID / Customer Ref *</label>
            <input type="text" id="customerIdentifier" placeholder="e.g. 45012345678" required>
        </div>

        <div class="form-group">
            <label>Payment Amount (₦) *</label>
            <input type="number" id="amount" placeholder="2000" min="100" required>
        </div>

        <button type="submit" class="btn">Proceed to Pay Bill</button>
    </form>
</div>

<script>
async function loadProviders() {
    const select = document.getElementById('providerSelect');
    try {
        const res = await fetch('/api/v1/bills/providers');
        const data = await res.json();
        if (data.status === 'success') {
            select.innerHTML = '<option value="" disabled selected>Select Utility / Cable Biller...</option>';
            data.data.forEach(item => {
                const opt = document.createElement('option');
                opt.value = item.id;
                opt.textContent = item.name;
                select.appendChild(opt);
            });
        }
    } catch (err) {
        console.error('Failed to load bill providers', err);
        select.innerHTML = '<option value="">Error loading providers</option>';
    }
}

document.getElementById('billForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const payload = {
        providerId: document.getElementById('providerSelect').value,
        customerIdentifier: document.getElementById('customerIdentifier').value,
        amount: document.getElementById('amount').value
    };

    try {
        const response = await fetch('/api/v1/bills/pay', {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json',
                'Accept': 'application/json' 
            },
            body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (result.status === 'success') {
            alert(`✅ Session Created!\nRef: ${result.accountRef}\nTotal Payable: ₦${result.pricing.totalCustomerPayment}\nProceeding to payment gateway...`);
        } else {
            alert(`Error: ${result.message}`);
        }
    } catch (err) {
        console.error('Bill payment submit error:', err);
        alert('Failed to connect to bill payment gateway server.');
    }
});

window.onload = loadProviders;
</script>

</body>
</html>
