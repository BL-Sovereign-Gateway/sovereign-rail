<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merchant Onboarding | @BL SOVEREIGN GATEWAY</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { background: #1e293b; border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 30px; width: 100%; max-width: 500px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); }
        .header { text-align: center; margin-bottom: 20px; }
        .header h2 { color: #38bdf8; font-size: 1.5rem; margin-bottom: 6px; }
        .header p { color: #94a3b8; font-size: 0.85rem; }
        
        /* 💸 CASHBACK BANNER */
        .cashback-banner { background: rgba(16, 185, 129, 0.15); border: 1px solid #10b981; border-radius: 8px; padding: 10px; text-align: center; color: #10b981; font-weight: 700; font-size: 0.85rem; margin-bottom: 20px; }
        
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 0.85rem; color: #cbd5e1; margin-bottom: 6px; }
        input, select { width: 100%; padding: 12px; border-radius: 8px; background: #0f172a; border: 1px solid #334155; color: #fff; font-size: 0.95rem; outline: none; }
        input:focus, select:focus { border-color: #38bdf8; }
        button.btn { width: 100%; padding: 14px; background: #0ea5e9; color: #fff; border: none; border-radius: 8px; font-weight: 700; font-size: 1rem; cursor: pointer; margin-top: 10px; }
        button.btn:hover { background: #38bdf8; }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <h2>🏛️ MERCHANT ONBOARDING</h2>
        <p>Connect your settlement bank account to @BL Sovereign Gateway</p>
    </div>

    <!-- 💸 CASHBACK PROMO -->
    <div class="cashback-banner">
        💸 EARN ₦2.00 INSTANT CASHBACK ON EVERY TRANSACTION PROCESSED!
    </div>

    <form id="registerForm">
        <div class="form-group">
            <label>Business / Merchant Name *</label>
            <input type="text" id="merchantName" placeholder="e.g. Real Schools / All Time Business" required>
        </div>

        <div class="form-group">
            <label>Business Email Address *</label>
            <input type="email" id="email" placeholder="leadstrategist@alltimebusiness.com.ng" required>
        </div>

        <div class="form-group">
            <label>Phone Number *</label>
            <input type="tel" id="phone" placeholder="08022552528" required>
        </div>

        <div class="form-group">
            <label>Account Password *</label>
            <input type="password" id="password" placeholder="••••••••" required>
        </div>

        <div class="form-group">
            <label>Settlement Bank Name *</label>
            <select id="bankName" required>
                <option value="" disabled selected>Select Settlement Bank...</option>
                <!-- Major Commercial Banks -->
                <option value="Access Bank Plc">Access Bank Plc</option>
                <option value="Zenith Bank">Zenith Bank</option>
                <option value="Guaranty Trust Bank (GTBank)">Guaranty Trust Bank (GTBank)</option>
                <option value="First Bank of Nigeria">First Bank of Nigeria</option>
                <option value="United Bank for Africa (UBA)">United Bank for Africa (UBA)</option>
                <option value="Fidelity Bank">Fidelity Bank</option>
                <option value="Stanbic IBTC Bank">Stanbic IBTC Bank</option>
                <option value="Sterling Bank">Sterling Bank</option>
                <option value="Union Bank of Nigeria">Union Bank of Nigeria</option>
                <option value="Wema Bank">Wema Bank</option>
                <option value="Ecobank Nigeria">Ecobank Nigeria</option>
                <option value="FCMB (First City Monument Bank)">FCMB (First City Monument Bank)</option>
                <option value="Heritage Bank">Heritage Bank</option>
                <option value="Keystone Bank">Keystone Bank</option>
                <option value="Polaris Bank">Polaris Bank</option>
                <option value="Titan Trust Bank">Titan Trust Bank</option>
                <option value="Unity Bank">Unity Bank</option>
                <option value="Jaiz Bank">Jaiz Bank</option>
                <option value="TAJBank">TAJBank</option>
                <option value="Lotus Bank">Lotus Bank</option>
                
                <!-- Digital Banks, Fintechs & MFBs -->
                <option value="OPay Digital Services">OPay Digital Services</option>
                <option value="PalmPay">PalmPay</option>
                <option value="Moniepoint Microfinance Bank">Moniepoint Microfinance Bank</option>
                <option value="Kuda Bank">Kuda Bank</option>
                <option value="Nomba / MFB">Nomba / MFB</option>
                <option value="FairMoney Microfinance Bank">FairMoney Microfinance Bank</option>
                <option value="VFD Microfinance Bank">VFD Microfinance Bank</option>
                <option value="Rubies Bank">Rubies Bank</option>
            </select>
        </div>

        <div class="form-group">
            <label>Settlement Account Number (NUBAN) *</label>
            <input type="text" id="settlementAccount" placeholder="0037323182" maxlength="10" required>
        </div>

        <button type="submit" class="btn">Register Merchant Account</button>
    </form>
</div>

<script>
document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const payload = {
        merchantName: document.getElementById('merchantName').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        password: document.getElementById('password').value,
        settlementAccount: document.getElementById('settlementAccount').value,
        bankName: document.getElementById('bankName').value
    };

    try {
        const response = await fetch('/api/v1/register', {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json',
                'Accept': 'application/json' 
            },
            body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (result.status === 'success') {
            alert('Account created! Redirecting to dashboard...');
            window.location.href = '/dashboard';
        } else {
            alert(`Error: ${result.message}`);
        }
    } catch (err) {
        console.error('Registration submit error:', err);
        alert('Failed to connect to registration server.');
    }
});
</script>

</body>
</html>
