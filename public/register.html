<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merchant Onboarding | @BL SOVEREIGN GATEWAY</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { background: #1e293b; border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 30px; width: 100%; max-width: 520px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); }
        .header { text-align: center; margin-bottom: 20px; }
        .header h2 { color: #38bdf8; font-size: 1.5rem; margin-bottom: 6px; }
        .header p { color: #94a3b8; font-size: 0.85rem; }
        
        /* 💸 CASHBACK BANNER */
        .cashback-banner { background: rgba(16, 185, 129, 0.15); border: 1px solid #10b981; border-radius: 8px; padding: 10px; text-align: center; color: #10b981; font-weight: 700; font-size: 0.85rem; margin-bottom: 20px; }
        
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 0.85rem; color: #cbd5e1; margin-bottom: 6px; }
        input, select { width: 100%; padding: 12px; border-radius: 8px; background: #0f172a; border: 1px solid #334155; color: #fff; font-size: 0.95rem; outline: none; }
        input:focus, select:focus { border-color: #38bdf8; }

        .password-wrapper { position: relative; width: 100%; }
        .password-wrapper input { padding-right: 42px; }
        .toggle-password-btn { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 1.1rem; line-height: 1; transition: 0.2s; }
        .toggle-password-btn:hover { color: #38bdf8; }

        .auth-links-row { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 0.82rem; }
        .auth-links-row a { color: #38bdf8; text-decoration: none; font-weight: 600; }
        .auth-links-row a:hover { text-decoration: underline; }

        button.btn { width: 100%; padding: 14px; background: #0ea5e9; color: #fff; border: none; border-radius: 8px; font-weight: 700; font-size: 1rem; cursor: pointer; margin-top: 14px; transition: background 0.2s ease; }
        button.btn:hover { background: #38bdf8; color: #0f172a; }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <h2>🏛️ MERCHANT ONBOARDING</h2>
        <p>Connect your settlement bank account to @BL Sovereign Gateway</p>
    </div>

    <!-- 💸 CASHBACK PROMO -->
    <div class="cashback-banner">
        💸 EARN ₦2.00 INSTANT CASHBACK ON EVERY TRANSACTION PROCESSED!
    </div>

    <form id="registerForm">
        <div class="form-group">
            <label>Business / Merchant Name *</label>
            <input type="text" id="merchantName" placeholder="e.g. Real Schools / All Time Business" required>
        </div>

        <div class="form-group">
            <label>Customer Identifier * (Unique ID or Phone)</label>
            <input type="text" id="customerIdentifier" placeholder="e.g. 08022552528" required>
        </div>

        <div class="form-group">
            <label>Business Email Address *</label>
            <input type="email" id="email" placeholder="leadstrategist@alltimebusiness.com.ng" required>
        </div>

        <div class="form-group">
            <label>Phone Number *</label>
            <input type="tel" id="phone" placeholder="08022552528" required>
        </div>

        <div class="form-group">
            <label>Bank Verification Number (BVN - 11 Digits) *</label>
            <input type="text" id="bvn" maxlength="11" placeholder="22222222222" required>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
            <div class="form-group">
                <label>Date of Birth *</label>
                <input type="date" id="dob" required>
            </div>
            <div class="form-group">
                <label>Gender *</label>
                <select id="gender" required>
                    <option value="" disabled selected>Select...</option>
                    <option value="1">Male</option>
                    <option value="2">Female</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label>Account Password *</label>
            <div class="password-wrapper">
                <input type="password" id="password" placeholder="••••••••" required>
                <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility('password', this)">👁️</button>
            </div>
        </div>

        <div class="form-group">
            <label>Settlement Bank Name *</label>
            <select id="bankName" required>
                <option value="" disabled selected>Select Settlement Bank...</option>
                <option value="Access Bank Plc">Access Bank Plc</option>
                <option value="Zenith Bank">Zenith Bank</option>
                <option value="Guaranty Trust Bank (GTBank)">Guaranty Trust Bank (GTBank)</option>
                <option value="First Bank of Nigeria">First Bank of Nigeria</option>
                <option value="United Bank for Africa (UBA)">United Bank for Africa (UBA)</option>
                <option value="Fidelity Bank">Fidelity Bank</option>
                <option value="Stanbic IBTC Bank">Stanbic IBTC Bank</option>
                <option value="Sterling Bank">Sterling Bank</option>
                <option value="Union Bank of Nigeria">Union Bank of Nigeria</option>
                <option value="Wema Bank">Wema Bank</option>
                <option value="Ecobank Nigeria">Ecobank Nigeria</option>
                <option value="FCMB (First City Monument Bank)">FCMB (First City Monument Bank)</option>
                <option value="Keystone Bank">Keystone Bank</option>
                <option value="Polaris Bank">Polaris Bank</option>
                <option value="Titan Trust Bank">Titan Trust Bank</option>
                <option value="Unity Bank">Unity Bank</option>
                <option value="Jaiz Bank">Jaiz Bank</option>
                <option value="TAJBank">TAJBank</option>
                <option value="Lotus Bank">Lotus Bank</option>
                <option value="OPay Digital Services">OPay Digital Services</option>
                <option value="PalmPay">PalmPay</option>
                <option value="Moniepoint Microfinance Bank">Moniepoint Microfinance Bank</option>
                <option value="Kuda Bank">Kuda Bank</option>
                <option value="FairMoney Microfinance Bank">FairMoney Microfinance Bank</option>
                <option value="VFD Microfinance Bank">VFD Microfinance Bank</option>
            </select>
        </div>

        <div class="form-group">
            <label>Settlement Account Number (NUBAN) *</label>
            <input type="text" id="settlementAccount" placeholder="0037323182" maxlength="10" required>
        </div>

        <button type="submit" class="btn">Register Merchant Account & Generate NUBAN</button>

        <div class="auth-links-row">
            <a href="/login">Already registered? Sign In</a>
            <a href="/login" onclick="alert('Please contact support or use password reset on sign-in page.')">Forgot Password?</a>
        </div>
    </form>
</div>

<script>
function togglePasswordVisibility(inputId, btn) {
    const input = document.getElementById(inputId);
    if (input.type === 'password') {
        input.type = 'text';
        btn.innerText = '🙈';
    } else {
        input.type = 'password';
        btn.innerText = '👁️';
    }
}

document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const payload = {
        merchantName: document.getElementById('merchantName').value.trim(),
        customerIdentifier: document.getElementById('customerIdentifier').value.trim(),
        email: document.getElementById('email').value.trim(),
        phone: document.getElementById('phone').value.trim(),
        bvn: document.getElementById('bvn').value.trim(),
        dob: document.getElementById('dob').value,
        gender: parseInt(document.getElementById('gender').value),
        password: document.getElementById('password').value,
        bankName: document.getElementById('bankName').value,
        settlementAccount: document.getElementById('settlementAccount').value.trim()
    };

    try {
        const response = await fetch('/api/v1/auth/signup', {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json',
                'Accept': 'application/json' 
            },
            body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (response.ok && result.status === 'success') {
            alert('🎉 Account created successfully! Your unique GTBank Virtual Account is now live.');
            localStorage.setItem('activeMerchant', JSON.stringify(result.merchant));
            window.location.href = '/dashboard';
        } else {
            alert(`Error: ${result.message || 'Registration failed'}`);
        }
    } catch (err) {
        console.error('Registration submit error:', err);
        alert('Failed to connect to registration server.');
    }
});
</script>

</body>
</html>
