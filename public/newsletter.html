<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Official Broadcasts & Intelligence — ALL TIME BUSINESS LTD</title>
    <style>
        body {
            background-color: #0a0f1d;
            color: #f1f5f9;
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .brand-header {
            text-align: center;
            border-bottom: 2px solid #233148;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .brand-title {
            color: #38bdf8;
            font-size: 24px;
            font-weight: 800;
            margin: 0;
        }

        .brand-subtitle {
            color: #10b981;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.5px;
            margin-top: 5px;
        }

        .post-card {
            background: #131c2e;
            border: 1px solid #233148;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .post-title {
            color: #38bdf8;
            font-size: 20px;
            font-weight: 700;
            margin: 0 0 10px 0;
        }

        .post-meta {
            font-size: 12px;
            color: #8295b3;
            margin-bottom: 15px;
        }

        .post-content {
            font-size: 15px;
            line-height: 1.6;
            color: #cbd5e1;
            white-space: pre-line;
        }

        .post-media {
            width: 100%;
            max-height: 450px;
            object-fit: cover;
            border-radius: 8px;
            margin-top: 15px;
            border: 1px solid #233148;
        }

        .no-posts {
            text-align: center;
            color: #8295b3;
            padding: 40px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="brand-header">
        <div class="brand-title">ALL TIME BUSINESS LTD</div>
        <div class="brand-subtitle">@BL SOVEREIGN GATEWAY • OFFICIAL DESK BROADCASTS</div>
    </div>

    <!-- Container where dynamically loaded broadcasts appear -->
    <div id="postsFeed">
        <div class="no-posts">Loading latest articles and announcements...</div>
    </div>
</div>

<script>
    async function loadPublishedBroadcasts() {
        const feedContainer = document.getElementById('postsFeed');
        try {
            const response = await fetch('/api/v1/newsletter/posts');
            const data = await response.json();

            if (data.status === 'success' && data.posts && data.posts.length > 0) {
                feedContainer.innerHTML = ''; // Clear fallback message

                data.posts.forEach(post => {
                    const postDate = new Date(post.timestamp).toLocaleDateString('en-US', {
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric'
                    });

                    let mediaHtml = '';
                    if (post.imageUrl) {
                        mediaHtml += `<img src="${post.imageUrl}" class="post-media" alt="Broadcast Image">`;
                    }
                    if (post.videoUrl) {
                        mediaHtml += `<video src="${post.videoUrl}" class="post-media" controls></video>`;
                    }

                    const card = document.createElement('div');
                    card.className = 'post-card';
                    card.innerHTML = `
                        <div class="post-title">${post.title}</div>
                        <div class="post-meta">Published: ${postDate} • By ${post.author || 'ALL TIME BUSINESS Editorial Desk'}</div>
                        <div class="post-content">${post.content}</div>
                        ${mediaHtml}
                    `;
                    feedContainer.appendChild(card);
                });
            } else {
                feedContainer.innerHTML = '<div class="no-posts">No published broadcasts found. Check back soon!</div>';
            }
        } catch (err) {
            console.error('Error loading posts:', err);
            feedContainer.innerHTML = '<div class="no-posts">Unable to load feed at this moment.</div>';
        }
    }

    window.onload = loadPublishedBroadcasts;
</script>

</body>
</html>
