<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@BL SOVEREIGN GATEWAY | Merchant Publications</title>
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0d1322;
            --bg-card: #162032;
            --border: #233148;
            --text-main: #f1f5f9;
            --text-sub: #8295b3;
            --text-muted: #64748b;
            --cyan-main: #38bdf8;
            --emerald-main: #10b981;
            --red-main: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); font-size: 14px; line-height: 1.6; padding: 30px; }

        .container { max-width: 800px; margin: 0 auto; }

        /* Minimal Header */
        .page-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 18px; margin-bottom: 25px; }
        .logo-text { font-size: 1.25rem; font-weight: 800; color: var(--cyan-main); letter-spacing: -0.3px; }
        .sub-logo { font-size: 0.7rem; text-transform: uppercase; color: var(--text-muted); font-weight: 700; letter-spacing: 0.5px; }

        .back-btn { display: inline-flex; align-items: center; gap: 6px; color: var(--cyan-main); text-decoration: none; font-weight: 700; font-size: 0.85rem; background: rgba(56, 189, 248, 0.1); border: 1px solid var(--cyan-main); padding: 6px 14px; border-radius: 6px; transition: 0.2s; }
        .back-btn:hover { background: var(--cyan-main); color: var(--bg-dark); }

        /* Publication Card Styling */
        .post-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; margin-bottom: 22px; }
        .post-title { font-size: 1.2rem; font-weight: 800; color: var(--cyan-main); margin-bottom: 6px; }
        .post-date { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; margin-bottom: 14px; }
        .post-body { color: var(--text-main); font-size: 0.92rem; white-space: pre-line; line-height: 1.6; }

        /* Media Frame */
        .media-frame { margin-top: 15px; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); background: #000; }
        .media-frame img, .media-frame video { width: 100%; max-height: 380px; object-fit: contain; display: block; }

        .badge-latest { background: rgba(16, 185, 129, 0.15); color: var(--emerald-main); border: 1px solid var(--emerald-main); padding: 2px 8px; border-radius: 4px; font-size: 0.68rem; font-weight: 800; text-transform: uppercase; }
        .empty-state { text-align: center; color: var(--text-muted); padding: 40px 20px; background: var(--bg-card); border: 1px dashed var(--border); border-radius: 12px; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Minimal Top Header -->
        <header class="page-header">
            <div>
                <div class="logo-text">@BL SOVEREIGN GATEWAY</div>
                <div class="sub-logo">Official Merchant Broadcasts & Publications</div>
            </div>
            <a href="/dashboard" class="back-btn">⬅️ Back to Dashboard</a>
        </header>

        <!-- Live Feed Container -->
        <div id="publicationFeed">
            <div class="empty-state">
                ⏳ Loading live publications...
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', fetchPublications);

        async function fetchPublications() {
            const feed = document.getElementById('publicationFeed');
            try {
                const res = await fetch('/api/v1/broadcasts');
                const data = await res.json();

                if (data.status === 'success' && data.broadcasts && data.broadcasts.length > 0) {
                    feed.innerHTML = '';

                    data.broadcasts.forEach((post, index) => {
                        const card = document.createElement('div');
                        card.className = 'post-card';

                        const dateStr = post.publishedAt ? new Date(post.publishedAt).toLocaleString('en-NG', { dateStyle: 'medium', timeStyle: 'short' }) : 'Recently Published';

                        let mediaHtml = '';
                        if (post.image) {
                            mediaHtml += `<div class="media-frame"><img src="${post.image}" alt="Attachment"></div>`;
                        }
                        if (post.video) {
                            mediaHtml += `<div class="media-frame" style="margin-top:10px;"><video src="${post.video}" controls></video></div>`;
                        }

                        card.innerHTML = `
                            <div style="display: flex; justify-content: space-between; align-items: start;">
                                <div class="post-title">${post.title}</div>
                                ${index === 0 ? '<span class="badge-latest">LATEST</span>' : ''}
                            </div>
                            <div class="post-date">Published: ${dateStr}</div>
                            <div class="post-body">${post.body}</div>
                            ${mediaHtml}
                        `;

                        feed.appendChild(card);
                    });
                } else {
                    feed.innerHTML = `
                        <div class="post-card">
                            <div class="post-title">🎁 Welcome to @BL SOVEREIGN GATEWAY</div>
                            <div class="post-date">Published: September 2026</div>
                            <div class="post-body">Stay updated with official business announcements, feature updates, and platform highlights directly from our management desk.</div>
                        </div>
                    `;
                }
            } catch (err) {
                feed.innerHTML = `<div class="empty-state" style="color: var(--red-main);">❌ Error loading publications.</div>`;
            }
        }
    </script>
</body>
</html>
