<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Public Reader Desk | @BL SOVEREIGN GATEWAY</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #fff; min-height: 100vh; display: flex; flex-direction: column; }

        /* SINGLE CLEAN TOP HEADER */
        .top-nav {
            background: #1e293b;
            border-bottom: 1px solid #334155;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand-logo {
            font-size: 1.15rem;
            font-weight: 800;
            color: #38bdf8;
            letter-spacing: 0.8px;
            text-decoration: none;
            text-transform: uppercase;
        }

        /* MAIN CONTAINER */
        .container {
            width: 100%;
            max-width: 850px;
            margin: 30px auto;
            padding: 0 20px;
            flex: 1;
        }

        /* FANCY HEADER WITH BADGE */
        .feed-header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 1px solid #334155;
            padding-bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .feed-header h1 {
            font-size: 2.1rem;
            font-weight: 900;
            color: #38bdf8;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
        }

        .broadcast-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: #38bdf8;
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 5px 16px;
            border-radius: 20px;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.15);
        }

        /* ARTICLE CARDS */
        .article-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 14px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .article-card:hover {
            border-color: #38bdf8;
            transform: translateY(-2px);
        }

        .article-title {
            font-size: 1.35rem;
            font-weight: 800;
            color: #f1f5f9;
            margin-bottom: 10px;
            line-height: 1.4;
            letter-spacing: 0.5px;
        }

        .article-meta {
            font-size: 0.78rem;
            color: #38bdf8;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .article-summary {
            font-size: 0.9rem;
            color: #cbd5e1;
            line-height: 1.6;
            margin-bottom: 16px;
            white-space: pre-wrap;
        }

        .article-media {
            width: 100%;
            border-radius: 10px;
            margin-bottom: 16px;
            max-height: 420px;
            object-fit: cover;
            border: 1px solid #334155;
        }

        .article-video {
            width: 100%;
            border-radius: 10px;
            margin-bottom: 16px;
            max-height: 420px;
            background: #000;
            border: 1px solid #334155;
        }

        /* FOOTER */
        .footer {
            text-align: center;
            padding: 20px;
            font-size: 0.75rem;
            color: #64748b;
            border-top: 1px solid #1e293b;
            margin-top: auto;
        }

        @media (max-width: 768px) {
            .container { padding: 0 15px; }
            .feed-header h1 { font-size: 1.6rem; }
        }
    </style>
</head>
<body onload="loadPublicFeed()">

<!-- CLEAN TOP NAVIGATION BRANDING -->
<nav class="top-nav">
    <div class="brand-logo">ALL TIME BUSINESS LTD</div>
</nav>

<!-- MAIN CONTAINER -->
<div class="container">
    <div class="feed-header">
        <h1>@BL SOVEREIGN GATEWAY</h1>
        <div class="broadcast-badge">
            📡 OFFICIAL DESK BROADCASTS
        </div>
    </div>

    <!-- FEED CONTAINER -->
    <div id="feedContainer">
        <p style="text-align: center; color: #38bdf8; font-weight: 600;">⏳ Loading official gateway broadcasts...</p>
    </div>
</div>

<!-- FOOTER -->
<footer class="footer">
    © 2026 ALL TIME BUSINESS LTD (RC: 950444) | @BL Sovereign Gateway Official Feed
</footer>

<script>
    const DEFAULT_ARTICLES = [
        {
            id: 'default-sovereign-1',
            title: 'ONE GATEWAY. ENDLESS FINANCIAL FREEDOM.',
            summary: 'Lagos, Nigeria — October 2026\n\nIn today\'s fast-paced digital economy, real-time transaction fulfillment, instant account settlement, and friction-free micro-contributions are essential.\n\n@BL SOVEREIGN GATEWAY, managed under ALL TIME BUSINESS LTD (RC: 950444), empowers merchants and commercial entities across Nigeria with direct bank auto-crediting, VTU cashbacks, and digital Ajo savings.',
            date: '10/10/2026, 6:06:53 PM'
        }
    ];

    async function loadPublicFeed() {
        const feedContainer = document.getElementById('feedContainer');
        let articles = [];

        try {
            const stored = localStorage.getItem('publishedGatewayArticles');
            if (stored) {
                articles = JSON.parse(stored);
            }
        } catch (e) {
            console.warn('LocalStorage error:', e);
        }

        try {
            const response = await fetch('/api/v1/newsletter/feed');
            if (response.ok) {
                const rawText = await response.text();
                if (rawText && !rawText.trim().startsWith('<')) {
                    const data = JSON.parse(rawText);
                    if (data.articles && Array.isArray(data.articles) && data.articles.length > 0) {
                        articles = [...articles, ...data.articles];
                    }
                }
            }
        } catch (err) {
            console.log('Backend feed API offline; rendering cached publications.');
        }

        if (articles.length === 0) {
            articles = DEFAULT_ARTICLES;
        }

        renderArticles(articles);
    }

    function renderArticles(articles) {
        const feedContainer = document.getElementById('feedContainer');
        feedContainer.innerHTML = '';

        articles.forEach(art => {
            const card = document.createElement('div');
            card.className = 'article-card';

            let mediaHTML = '';
            if (art.imageUrl) {
                mediaHTML += `<img src="${art.imageUrl}" class="article-media" alt="Official Broadcast Media">`;
            }
            if (art.videoUrl) {
                mediaHTML += `<video src="${art.videoUrl}" class="article-video" controls></video>`;
            }

            const title = art.title || art.headline || 'ONE GATEWAY. ENDLESS FINANCIAL FREEDOM.';
            const bodyContent = art.content || art.summary || '';
            const dateStr = art.date || '10/10/2026, 6:06:53 PM';

            card.innerHTML = `
                <div class="article-title">${title}</div>
                <div class="article-meta">
                    <span>📢 Official Broadcast</span>
                    <span>•</span>
                    <span>🗓️ ${dateStr}</span>
                </div>
                ${mediaHTML}
                <div class="article-summary">${bodyContent}</div>
            `;

            feedContainer.appendChild(card);
        });
    }
</script>

</body>
</html>
