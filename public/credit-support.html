<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAIL Credit Support | @BL SOVEREIGN GATEWAY</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { background: #1e293b; border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 30px; width: 100%; max-width: 500px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); }
        .header { text-align: center; margin-bottom: 20px; }
        .header h2 { color: #38bdf8; font-size: 1.5rem; margin-bottom: 6px; }
        .header p { color: #94a3b8; font-size: 0.85rem; }
        
        .promo-banner { background: rgba(56, 189, 248, 0.15); border: 1px solid #38bdf8; border-radius: 8px; padding: 10px; text-align: center; color: #38bdf8; font-weight: 700; font-size: 0.8rem; margin-bottom: 20px; }
        
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 0.85rem; color: #cbd5e1; margin-bottom: 6px; }
        input, select { width: 100%; padding: 12px; border-radius: 8px; background: #0f172a; border: 1px solid #334155; color: #fff; font-size: 0.95rem; outline: none; }
        input:focus, select:focus { border-color: #38bdf8; }
        button.btn { width: 100%; padding: 14px; background: #0ea5e9; color: #fff; border: none; border-radius: 8px; font-weight: 700; font-size: 1rem; cursor: pointer; margin-top: 10px; }
        button.btn:hover { background: #38bdf8; }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <h2>💳 SAIL CREDIT SUPPORT</h2>
        <p>Working Capital & Inventory Financing for Merchants</p>
    </div>

    <div class="promo-banner">
        ACCESSIBLE CREDIT LINES POWERED BY YOUR DAILY SETTLEMENT VOLUME!
    </div>

    <form id="creditForm">
        <div class="form-group">
            <label>Merchant ID / Business Name *</label>
            <input type="text" id="merchantName" placeholder="Tope Ogegbo" required>
        </div>

        <div class="form-group">
            <label>Credit Amount Requested (₦) *</label>
            <input type="number" id="creditAmount" placeholder="50000" min="1000" required>
        </div>

        <div class="form-group">
            <label>Repayment Tenor *</label>
            <select id="tenor" required>
                <option value="30">30 Days (Daily Deduction)</option>
                <option value="60">60 Days (Bi-weekly Deduction)</option>
                <option value="90">90 Days (Monthly Deduction)</option>
            </select>
        </div>

        <div class="form-group">
            <label>Estimated Monthly Gateway Turnover (₦) *</label>
            <input type="number" id="monthlyTurnover" placeholder="100000" required>
        </div>

        <button type="submit" class="btn">Apply for Credit Line</button>
    </form>
</div>

<script>
document.getElementById('creditForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const payload = {
        merchantName: document.getElementById('merchantName').value,
        amount: document.getElementById('creditAmount').value,
        tenor: document.getElementById('tenor').value,
        turnover: document.getElementById('monthlyTurnover').value
    };

    try {
        const response = await fetch('/api/v1/credit/apply', {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json',
                'Accept': 'application/json' 
            },
            body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (result.status === 'success') {
            alert(`✅ Credit Application Submitted!\nRef: ${result.applicationRef}\nYour daily settlement line is being evaluated.`);
            window.location.href = '/dashboard';
        } else {
            alert(`Error: ${result.message}`);
        }
    } catch (err) {
        console.error('Credit submit error:', err);
        alert('Failed to connect to credit gateway server.');
    }
});
</script>

</body>
</html>
