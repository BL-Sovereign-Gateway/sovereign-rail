<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAIL Credit Support | @BL SOVEREIGN GATEWAY</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { background: #1e293b; border: 1px solid #38bdf8; border-radius: 16px; padding: 30px; width: 100%; max-width: 500px; box-shadow: 0 20px 25px rgba(0,0,0,0.5); }
        .brand-header { text-align: center; margin-bottom: 20px; }
        .brand-header h2 { font-size: 1.3rem; font-weight: 800; color: #38bdf8; margin: 0; }
        .brand-header p { font-size: 0.75rem; color: #94a3b8; letter-spacing: 1px; margin-top: 2px; text-transform: uppercase; }

        .banner { background: rgba(56, 189, 248, 0.1); border: 1px solid #38bdf8; border-radius: 10px; padding: 14px; text-align: center; margin-bottom: 20px; }
        .banner h4 { color: #f59e0b; font-size: 0.9rem; margin-bottom: 4px; }
        .banner p { font-size: 0.8rem; color: #cbd5e1; }

        .form-group { margin-bottom: 14px; }
        label { display: block; font-size: 0.85rem; color: #cbd5e1; margin-bottom: 6px; }
        input, select { width: 100%; padding: 12px; border-radius: 8px; background: #0f172a; border: 1px solid #334155; color: #fff; font-size: 0.9rem; outline: none; }
        input:focus, select:focus { border-color: #38bdf8; }

        .btn-submit { width: 100%; padding: 14px; background: #10b981; color: #fff; border: none; border-radius: 8px; font-weight: 800; cursor: pointer; font-size: 1rem; margin-top: 10px; }
        .btn-submit:hover { background: #059669; }
    </style>
</head>
<body>

<div class="card">
    <div class="brand-header">
        <h2>💳 SAIL CREDIT SUPPORT</h2>
        <p>ALL TIME BUSINESS LTD | @BL SOVEREIGN GATEWAY</p>
    </div>

    <div class="banner">
        <h4>ACCESSIBLE CREDIT LINES POWERED BY YOUR DAILY SETTLEMENT VOLUME</h4>
        <p>Working Capital & Inventory Financing for Merchants</p>
    </div>

    <form id="creditForm">
        <div class="form-group">
            <label>Merchant ID / Business Name *</label>
            <input type="text" id="merchantId" placeholder="Tope Ogegbo" required>
        </div>

        <div class="form-group">
            <label>Credit Amount Requested (₦) *</label>
            <input type="number" id="creditAmount" placeholder="e.g. 50000" required>
        </div>

        <div class="form-group">
            <label>Repayment Tenor *</label>
            <select id="tenor" required>
                <option value="30">30 Days (Daily Automated Deduction)</option>
                <option value="60">60 Days (Weekly Automated Deduction)</option>
                <option value="90">90 Days (Monthly Automated Deduction)</option>
            </select>
        </div>

        <div class="form-group">
            <label>Estimated Monthly Gateway Turnover (₦) *</label>
            <input type="number" id="turnover" placeholder="e.g. 100000" required>
        </div>

        <button type="submit" class="btn-submit">Apply for Credit Line</button>
    </form>
</div>

<script>
document.getElementById('creditForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const amount = document.getElementById('creditAmount').value;
    alert(`🎉 Credit application for ₦${amount} submitted! Our underwriting engine will evaluate your settlement history and notify your registered email.`);
});

window.onload = () => {
    const session = localStorage.getItem('merchantSession');
    if (session) {
        const merchant = JSON.parse(session);
        document.getElementById('merchantId').value = merchant.merchantName;
    }
};
</script>

</body>
</html>
