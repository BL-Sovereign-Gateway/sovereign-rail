<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merchant Dashboard | @BL SOVEREIGN GATEWAY</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #fff; min-height: 100vh; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .nav { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #334155; margin-bottom: 30px; }
        .nav h1 { font-size: 1.25rem; color: #38bdf8; }
        .badge { background: #10b981; color: #000; padding: 4px 12px; border-radius: 20px; font-weight: 700; font-size: 0.75rem; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card { background: #1e293b; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 20px; }
        .card p { font-size: 0.8rem; color: #94a3b8; margin-bottom: 8px; }
        .card h3 { font-size: 1.5rem; color: #38bdf8; }

        .table-container { background: #1e293b; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 20px; overflow-x: auto; }
        .table-container h2 { font-size: 1rem; margin-bottom: 15px; color: #f8fafc; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.85rem; }
        th, td { padding: 12px; border-bottom: 1px solid #334155; }
        th { color: #94a3b8; font-weight: 600; }
        .status-paid { color: #10b981; font-weight: 700; }
    </style>
</head>
<body>

<div class="container">
    <div class="nav">
        <h1>🏛️ @BL SOVEREIGN GATEWAY</h1>
        <span class="badge">LIVE ENGINE ACTIVE</span>
    </div>

    <div class="grid">
        <div class="card">
            <p>Settlement Balance</p>
            <h3>₦0.00</h3>
        </div>
        <div class="card">
            <p>Cashback Earned (₦2/tx)</p>
            <h3 style="color:#10b981;">₦0.00</h3>
        </div>
        <div class="card">
            <p>Today's Transactions</p>
            <h3>0</h3>
        </div>
        <div class="card">
            <p>Active Portals</p>
            <h3 style="color:#a855f7;">4 Live</h3>
        </div>
    </div>

    <div class="table-container">
        <h2>Live Transaction Ledger</h2>
        <table>
            <thead>
                <tr>
                    <th>Reference</th>
                    <th>Type</th>
                    <th>Gross Amount</th>
                    <th>Net Settlement</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="ledgerBody">
                <tr>
                    <td colspan="5" style="text-align:center; color:#64748b; padding:20px;">
                        Listening for incoming Nomba bank transfers...
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
