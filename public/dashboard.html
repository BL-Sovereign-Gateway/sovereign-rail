<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@BL SOVEREIGN GATEWAY | Merchant Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0d1322;
            --bg-card: #162032;
            --bg-input: #0d1322;
            --border: #233148;
            --text-main: #f1f5f9;
            --text-sub: #8295b3;
            --cyan-main: #38bdf8;
            --cyan-hover: #0ea5e9;
            --emerald-main: #10b981;
            --amber-main: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); font-size: 14px; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }

        .auth-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 460px; padding: 32px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); }
        .brand-header { text-align: center; margin-bottom: 24px; border-bottom: 1px solid var(--border); padding-bottom: 18px; }
        .logo-text { font-size: 1.35rem; font-weight: 800; color: var(--cyan-main); letter-spacing: -0.3px; }
        .sub-logo { font-size: 0.72rem; text-transform: uppercase; color: var(--text-sub); font-weight: 700; letter-spacing: 0.5px; margin-top: 2px; }

        .auth-tabs { display: flex; gap: 8px; margin-bottom: 22px; background: var(--bg-dark); padding: 4px; border-radius: 8px; border: 1px solid var(--border); }
        .auth-tab-btn { flex: 1; padding: 10px; border: none; background: transparent; color: var(--text-sub); font-weight: 700; border-radius: 6px; cursor: pointer; font-size: 0.85rem; transition: 0.2s; }
        .auth-tab-btn.active { background: var(--bg-card); color: var(--cyan-main); border: 1px solid var(--border); }

        .input-group { margin-bottom: 16px; }
        .input-label { display: block; font-size: 0.75rem; text-transform: uppercase; color: var(--text-sub); margin-bottom: 6px; font-weight: 700; }
        .form-control, .form-select { width: 100%; padding: 12px; background: var(--bg-input); border: 1px solid var(--border); border-radius: 8px; color: var(--text-main); font-size: 0.92rem; transition: 0.2s; }
        .form-control:focus, .form-select:focus { border-color: var(--cyan-main); outline: none; }

        /* Forgot Password Action Link Container */
        .forgot-link-wrapper { display: flex; justify-content: flex-end; margin-top: 6px; margin-bottom: 18px; }
        .forgot-pass-link { color: var(--cyan-main); font-size: 0.78rem; font-weight: 600; text-decoration: none; cursor: pointer; transition: 0.2s; }
        .forgot-pass-link:hover { text-decoration: underline; color: var(--cyan-hover); }

        .btn-submit { width: 100%; background: var(--cyan-main); color: var(--bg-dark); padding: 13px; border: none; border-radius: 8px; font-weight: 800; font-size: 0.95rem; cursor: pointer; transition: 0.2s; margin-top: 6px; }
        .btn-submit:hover { background: var(--cyan-hover); }

        .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(13, 19, 34, 0.88); backdrop-filter: blur(6px); z-index: 9999; align-items: center; justify-content: center; padding: 15px; }
        .modal-content { background: var(--bg-card); border: 1px solid var(--cyan-main); width: 100%; max-width: 440px; border-radius: 14px; padding: 24px; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 16px; }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="brand-header">
            <div class="logo-text">⚡ @BL SOVEREIGN GATEWAY</div>
            <div class="sub-logo">ALL TIME BUSINESS LTD | MERCHANT PORTAL</div>
        </div>

        <!-- Auth Navigation Tabs -->
        <div class="auth-tabs">
            <button id="tabSignin" class="auth-tab-btn active" onclick="switchAuthTab('signin')">Sign In</button>
            <button id="tabSignup" class="auth-tab-btn" onclick="switchAuthTab('signup')">Sign Up (Onboarding)</button>
        </div>

        <!-- 1. SIGN IN FORM -->
        <form id="signinForm" onsubmit="handleSigninSubmit(event)">
            <div class="input-group">
                <label class="input-label">Phone Number (Username) *</label>
                <input type="tel" id="loginPhone" required placeholder="08012345678" class="form-control">
            </div>

            <div class="input-group" style="margin-bottom: 4px;">
                <label class="input-label">Password *</label>
                <input type="password" id="loginPassword" required placeholder="••••••••" class="form-control">
            </div>

            <!-- RESET PASSWORD LINK IN SIGN IN SECTION -->
            <div class="forgot-link-wrapper">
                <span class="forgot-pass-link" onclick="openResetModal()">Forgot Password or Security PIN?</span>
            </div>

            <button type="submit" class="btn-submit">Sign In to Dashboard</button>
        </form>

        <!-- 2. SIGN UP (ONBOARDING) FORM -->
        <form id="signupForm" style="display: none;" onsubmit="handleSignupSubmit(event)">
            <div class="input-group">
                <label class="input-label">Merchant / Business Name *</label>
                <input type="text" id="regName" required placeholder="e.g. Tope Ogegbo Ventures" class="form-control">
            </div>
            <div class="input-group">
                <label class="input-label">Phone Number *</label>
                <input type="tel" id="regPhone" required placeholder="08012345678" class="form-control">
            </div>
            <div class="input-group">
                <label class="input-label">Email Address *</label>
                <input type="email" id="regEmail" required placeholder="merchant@email.com" class="form-control">
            </div>
            <div class="input-group">
                <label class="input-label">Password *</label>
                <input type="password" id="regPassword" required placeholder="••••••••" class="form-control">
            </div>
            <div class="input-group">
                <label class="input-label">4-Digit Withdrawal PIN *</label>
                <input type="password" id="regPin" maxlength="4" pattern="\d{4}" required placeholder="1234" class="form-control">
            </div>
            <div class="input-group">
                <label class="input-label">Settlement Account Number *</label>
                <input type="text" id="regSettlementAcc" maxlength="10" pattern="\d{10}" required placeholder="0123456789" class="form-control">
            </div>
            <div class="input-group">
                <label class="input-label">Settlement Bank Name *</label>
                <select id="regBankName" required class="form-select">
                    <option value="">Select Settlement Bank...</option>
                    <option value="Access Bank Plc">Access Bank Plc</option>
                    <option value="Guaranty Trust Bank (GTB)">Guaranty Trust Bank (GTB)</option>
                    <option value="First Bank of Nigeria">First Bank of Nigeria</option>
                    <option value="Zenith Bank Plc">Zenith Bank Plc</option>
                    <option value="United Bank for Africa (UBA)">United Bank for Africa (UBA)</option>
                    <option value="Moniepoint MFB">Moniepoint Microfinance Bank</option>
                    <option value="OPay Digital Services">OPay Digital Services</option>
                    <option value="PalmPay Limited">PalmPay Limited</option>
                </select>
            </div>
            <button type="submit" class="btn-submit" style="background: var(--emerald-main); color: #fff;">
                Complete Onboarding & Get GTBank NUBAN
            </button>
        </form>
    </div>

    <!-- RESET PASSWORD / SECURITY PIN MODAL -->
    <div id="resetModal" class="modal-backdrop">
        <div class="modal-content">
            <div class="modal-header">
                <h3 style="margin: 0; color: var(--cyan-main); font-size: 1.05rem;">🔑 Reset Password / PIN</h3>
                <span onclick="closeResetModal()" style="cursor: pointer; font-size: 1.3rem; color: var(--text-sub);">&times;</span>
            </div>
            <form id="resetPassForm" onsubmit="handlePasswordReset(event)">
                <div class="input-group">
                    <label class="input-label">Registered Phone Number or Email</label>
                    <input type="text" id="resetIdentifier" required placeholder="08012345678 or merchant@email.com" class="form-control">
                </div>
                <div style="background: rgba(56, 189, 248, 0.08); border-left: 3px solid var(--cyan-main); padding: 10px; border-radius: 6px; font-size: 0.72rem; color: var(--text-sub); margin-bottom: 16px;">
                    📲 A security recovery code will be dispatched to your registered Termii SMS line and Resend Email inbox.
                </div>
                <button type="submit" class="btn-submit">Dispatch Reset Instructions</button>
            </form>
        </div>
    </div>

    <script>
        function switchAuthTab(tab) {
            if (tab === 'signin') {
                document.getElementById('tabSignin').classList.add('active');
                document.getElementById('tabSignup').classList.remove('active');
                document.getElementById('signinForm').style.display = 'block';
                document.getElementById('signupForm').style.display = 'none';
            } else {
                document.getElementById('tabSignup').classList.add('active');
                document.getElementById('tabSignin').classList.remove('active');
                document.getElementById('signinForm').style.display = 'none';
                document.getElementById('signupForm').style.display = 'block';
            }
        }

        async function handleSigninSubmit(e) {
            e.preventDefault();
            const phone = document.getElementById('loginPhone').value.trim();
            const password = document.getElementById('loginPassword').value;

            try {
                const response = await fetch('/api/v1/auth/signin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, password })
                });

                const result = await response.json();
                if (result.status === 'success') {
                    localStorage.setItem('activeMerchant', JSON.stringify(result.merchant));
                    window.location.href = '/dashboard';
                } else {
                    alert(`❌ Sign In Failed: ${result.message}`);
                }
            } catch (err) {
                alert('❌ Network error during sign in.');
            }
        }

        async function handleSignupSubmit(e) {
            e.preventDefault();
            const merchantName = document.getElementById('regName').value.trim();
            const phone = document.getElementById('regPhone').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            const withdrawalPin = document.getElementById('regPin').value;
            const settlementAccount = document.getElementById('regSettlementAcc').value;
            const bankName = document.getElementById('regBankName').value;

            try {
                const response = await fetch('/api/v1/auth/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ merchantName, phone, email, password, withdrawalPin, settlementAccount, bankName })
                });

                const result = await response.json();
                if (result.status === 'success') {
                    alert('🎉 Onboarding Successful! Dedicated GTBank Virtual NUBAN Generated.');
                    localStorage.setItem('activeMerchant', JSON.stringify(result.merchant));
                    window.location.href = '/dashboard';
                } else {
                    alert(`❌ Onboarding Failed: ${result.message}`);
                }
            } catch (err) {
                alert('❌ Network error during onboarding.');
            }
        }

        function openResetModal() {
            document.getElementById('resetModal').style.display = 'flex';
        }

        function closeResetModal() {
            document.getElementById('resetModal').style.display = 'none';
        }

        function handlePasswordReset(e) {
            e.preventDefault();
            const id = document.getElementById('resetIdentifier').value.trim();
            alert(`✅ Security recovery code dispatched to [${id}]. Please check your inbox and SMS alerts.`);
            closeResetModal();
        }
    </script>
</body>
</html>
