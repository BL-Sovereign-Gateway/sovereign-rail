<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merchant Dashboard - @BL Sovereign Gateway</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
    <nav class="border-b border-slate-800 bg-slate-900/50 p-4">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-cyan-400">@BL SOVEREIGN GATEWAY</h1>
            <span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-3 py-1 rounded-full text-xs font-medium">Merchant Portal</span>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto p-6 space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-slate-800 border border-slate-700 p-5 rounded-2xl">
                <p class="text-xs text-slate-400 font-medium">Available Balance</p>
                <p class="text-3xl font-bold text-white mt-2">₦0.00</p>
            </div>
            <div class="bg-slate-800 border border-slate-700 p-5 rounded-2xl">
                <p class="text-xs text-slate-400 font-medium">Total Cashback Earned (₦2.00/tx)</p>
                <p class="text-3xl font-bold text-emerald-400 mt-2">₦0.00</p>
            </div>
            <div class="bg-slate-800 border border-slate-700 p-5 rounded-2xl">
                <p class="text-xs text-slate-400 font-medium">Account Status</p>
                <p class="text-3xl font-bold text-cyan-400 mt-2">Active (Tier 1)</p>
            </div>
        </div>

        <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl">
            <h2 class="text-lg font-semibold text-cyan-400 mb-4">Generate Dynamic QR Code</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Target Payout Amount (₦)</label>
                    <input type="number" id="targetAmount" placeholder="e.g. 5000" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-sm">
                    <button onclick="generateVirtualAccount()" class="mt-3 w-full bg-cyan-500 hover:bg-cyan-600 text-slate-950 font-semibold py-2 rounded-lg text-sm">Generate Virtual Account & QR</button>
                </div>
                <div id="qrResult" class="bg-slate-900 border border-slate-700 p-4 rounded-xl flex items-center justify-center text-xs text-slate-400 text-center">
                    Enter amount and click generate to process dynamic Virtual NUBAN.
                </div>
            </div>
        </div>
    </main>

    <script>
        async function generateVirtualAccount() {
            const amount = document.getElementById('targetAmount').value;
            const resBox = document.getElementById('qrResult');
            if(!amount) return alert('Enter an amount');

            resBox.innerText = "Generating account details...";
            try {
                const res = await fetch('/api/v1/create-virtual-account', {
                    method: 'POST',
                    headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({
                        schoolName: "Merchant Quick Pay",
                        targetAmount: amount,
                        accountRef: "REF-" + Date.now()
                    })
                });
                const data = await res.json();
                if(res.ok) {
                    resBox.innerHTML = `
                        <div class="text-left w-full space-y-1">
                            <p class="text-emerald-400 font-semibold">Account Generated!</p>
                            <p>Bank: ${data.account_details.bankName}</p>
                            <p>Account No: <b class="text-white">${data.account_details.accountNumber}</b></p>
                            <p>Customer Transfers: <b class="text-cyan-400">${data.account_details.customerMustTransfer}</b></p>
                        </div>
                    `;
                } else {
                    resBox.innerText = "Error: " + data.message;
                }
            } catch(e) {
                resBox.innerText = "Connection error.";
            }
        }
    </script>
</body>
</html>
